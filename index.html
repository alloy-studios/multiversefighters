/* ---------------- rubber-hose toon body (ZAP) ---------------- */
function noodle(c,a,e,b,w,col){
  const cx=2*e[0]-(a[0]+b[0])/2,cy=2*e[1]-(a[1]+b[1])/2;
  c.beginPath();c.moveTo(a[0],a[1]);c.quadraticCurveTo(cx,cy,b[0],b[1]);
  c.lineCap='round';
  if(!RL){c.lineWidth=w+OLW*2;c.strokeStyle=tc('#140f08');c.stroke();}
  c.lineWidth=w;c.strokeStyle=tc(col);c.stroke();
}
function toonArm(c,A,front,shape){
  const {S,lk}=RS;noodle(c,A.s,A.e,A.h,3*S,front?lk.limb:mixC(lk.limb,'#000',.2));
  drawToonGlove(c,A.h,A.A2,shape,S*1.05);
}
function toonLeg(c,L){
  const {S,lk}=RS;noodle(c,L.h,L.k,L.a,3.4*S,lk.limb);
  drawFoot(c,L,MAT(lk.boots),S*1.25,'toon',RS.po.pt);
}
function toonTorso(c,t){
  const {S,K,lk,ch}=RS,g=K.g;
  const bp=cc=>{const P=[TPh(-10,-3),TPh(-12.5,-18),TP(-11,-30),TP(-6,-38),TP(4,-38.5),TP(11,-30),TP(12,-18),TPh(10,-3),TPh(0,2)];smoothTo(cc,P,true);cc.closePath();};
  part(c,bp,MAT(lk.top),0);
  clipDo(c,bp,()=>{fillOnly(c,cc=>{const a=TPh(-16,-8);cc.rect(a[0]-20*S,a[1],60*S,30*S);},lk.pants);});
  c.beginPath();bp(c);c.lineWidth=OLW;c.strokeStyle=tc('#140f08');c.stroke();
  for(let i=0;i<2;i++){const p=TP(7,-30+i*8);part(c,cc=>{cc.arc(p[0],p[1],2.4*S,0,TAU);},MAT('#ffffff'),0);}
}

/* ======================= drawBody =======================
   opt: vx/vy (local body velocity, drives cloth), sway, sq (squash), spin, cloth (state),
        dt (cloth step), plant (snap feet), sheathed, noWep, ink, floatK                    */
function drawBody(c,ch,po,sc,t,opt){
  opt=opt||{};
  const S=sc*ch.h,lk=ch.lk,M=mats(ch);
  const K=skel(ch,po,S,opt);
  const tf=c.getTransform(),px=Math.hypot(tf.a,tf.b);
  const prev=RS,oOL=OLW;
  RS={S,ch,lk,M,K,t,po,opt,px:px*S,flat:!!lk.toon,dtc:opt.nosim?0:(opt.dt||0)};
  OLW=1.45*S*(lk.toon?1.45:1)*(opt.ink||1);
  c.save();c.lineJoin='round';c.lineCap='round';
  if(opt.sq)c.scale(1+opt.sq*.3,1-opt.sq*.3);
  const piv=(a)=>{c.translate(K.hip[0],K.hip[1]-6*S);c.rotate(a);c.translate(-K.hip[0],-K.hip[1]+6*S);};
  if(opt.spin)piv(opt.spin);
  if(po.rot)piv(po.rot);
  if(lk.float&&opt.floatK!==0)c.translate(0,-lk.float*S*(opt.floatK===undefined?1:opt.floatK)*(1+.14*Math.sin(t*2.2)));
  const st=opt.cloth||null;
  try{
    drawBackCloth(c,t,st);
    const hB=po.hB!==undefined?po.hB:(lk.sheath?3:0);
    if(lk.toon)toonArm(c,K.aB,false,hB);else{drawArm(c,K.aB,false,hB);}
    if(lk.toon){toonLeg(c,K.lB);toonTorso(c,t);toonLeg(c,K.lF);}
    else{
      drawLeg(c,K.lB,false);
      if(lk.sheath)drawSheath(c,!!opt.sheathed);
      inkP(c,pelvisPath,M.pants);drawLeg(c,K.lF,true,1);      // ink pelvis + front leg together,
      fillP(c,pelvisPath,M.pants,2.6*S);drawLeg(c,K.lF,true,2); // then fill: one clean hip silhouette
      drawTorso(c,t);drawBelt(c);
    }
    drawSkirt(c,t);drawFrontCloth(c,t,st);
    drawHead(c,t,opt);
    const armed=ch.wep!=='none'&&ch.wep!=='claw'&&ch.wep!=='cannon'&&!(opt.sheathed&&ch.wep==='katana');
    const hF=po.hF!==undefined?po.hF:(armed?3:0);
    if(lk.toon)toonArm(c,K.aF,true,hF);
    else{
      const wBefore=ch.wep==='katana'||ch.wep==='cleaver'||ch.wep==='staff'||ch.wep==='hammer'||ch.wep==='scythe'||ch.wep==='bow';
      drawArm(c,K.aF,true,hF,true);
      if(wBefore)drawWeapon(c,t,opt);
      if(ch.wep!=='cannon'||opt.noWep)drawArmHand(c,K.aF,true,hF);
      if(!wBefore)drawWeapon(c,t,opt);
    }
  }finally{c.restore();RS=prev;OLW=oOL;}
  return K;
}

/* =======================================================================
   ANIMATION — picks a target pose for the fighter's state, then blends the
   live pose toward it every frame so nothing snaps. Gait is procedural IK:
   feet follow a stride ellipse locked to ground speed, so they never slide.
   ======================================================================= */
const PS=1.22;
function stanceOf(f){return STANCE[f.ch.lk.stance]||POSE.idle;}
function idlePose(f,T){
  const lk=f.ch.lk,s=stanceOf(f),b=copyPose(s),br=Math.sin(T*2.4),sh=Math.sin(T*.83);
  const k=lk.stance==='mech'?.6:1;
  b.ty+=br*1.3*k;b.lean+=sh*.022+br*.012;
  b.aB[0]+=br*.05*k;b.aF[0]-=br*.04*k;b.aF[1]+=br*.03;b.head+=br*.02-sh*.02;
  if(lk.stance==='toon'){const h=Math.abs(Math.sin(T*5.2));b.ty+=-h*6+3;b.aF[0]+=Math.sin(T*5.2)*.25;b.aB[0]-=Math.sin(T*5.2)*.25;}
  if(lk.stance==='ninja'){b.ty+=Math.abs(Math.sin(T*3.3))*1.6;}
  if(lk.stance==='floaty'||lk.stance==='reaper'){b.aF[0]+=Math.sin(T*1.6)*.12;b.aB[0]+=Math.sin(T*1.6+1)*.12;}
  return b;
}
function overshoot(w,s,k){   // extrapolate past the strike along windup->strike
  const o=copyPose(s);
  for(const q of _PK)o[q]=(s[q]||0)+((s[q]||0)-(w[q]||0))*k;
  for(const q of['aB','aF','lB','lF'])o[q]=[s[q][0]+(s[q][0]-w[q][0])*k, s[q][1]+(s[q][1]-w[q][1])*k];
  return o;
}
// head lags the torso. Copies — POSE entries are shared constants, never mutate them.
function hl(p){const o=copyPose(p);o.head=(p.head||0)-p.lean*.3;return o;}

/* ---- procedural gait ---- */
function gaitPose(f,dt,sprint){
  const ch=f.ch,lk=ch.lk,style=lk.move,sc=PS*ch.h,v=Math.abs(f.vx);
  if(style==='float'){                                  // hover glide — legs trail, cloth streams
    const b=P({lean:sprint?.55:.36,ty:-2,head:-.2,aB:[-.9,.6],aF:[-.5,.9],lB:[-.35,-.5],lF:[.05,-.7],pt:1,hF:1,hB:1});
    if(ch.wep!=='none'){b.aF=[.5,.7];b.wa=stanceOf(f).wa;}
    b.ty+=Math.sin(T*3)*2;return b;
  }
  const ninja=style==='ninja',heavy=style==='heavy',toon=style==='toon';
  const stride=heavy?13:toon?11:(sprint||ninja)?20:17, lift=heavy?7:toon?15:sprint?12:10;
  f.runPh+=dt*Math.PI*v/(2*stride*sc)*(toon?1.25:1);
  const ph=f.runPh, hy=-G.HIP;
  const lean=ninja?.62:heavy?.14:toon?.12:(sprint?.46:.24+.08*clamp(v/500,0,1));
  const ty=(heavy?4:2.4)+(heavy?4:3)*(1-Math.abs(Math.cos(ph)))-(sprint?1:0);
  const leg=(sgn,phi)=>{
    const x=stride*Math.cos(phi)+(sprint?4:2), y=-G.ANK-lift*Math.max(0,-Math.sin(phi));
    return ik2(sgn*3.5,hy+ty,x,y,G.THIGH,G.SHIN);
  };
  const b=P({lean,ty,head:-lean*.45,lF:leg(1,ph),lB:leg(-1,ph+Math.PI),pt:.2,ex:sprint?'f':'n'});
  const cF=Math.cos(ph),cB=-cF;
  if(ninja){b.aF=[-1.3+Math.sin(ph*2)*.08,.25];b.aB=[-1.15,.3];b.hF=1;b.hB=1;}
  else if(toon){b.aF=[Math.sin(ph*2)*1.7,1.3];b.aB=[-Math.sin(ph*2)*1.7,1.3];b.ex='g';}
  else{const amp=heavy?.5:sprint?1.25:.95,el=heavy?1.0:1.5;
    b.aF=[.25-amp*cF,el+.2*Math.max(0,cF)];b.aB=[.25-amp*cB,el+.2*Math.max(0,cB)];}
  const s=stanceOf(f);
  if(ch.wep!=='none'&&ch.wep!=='claw'&&!ninja&&!toon){b.aF=[lerp(b.aF[0],s.aF[0],.6),lerp(b.aF[1],s.aF[1],.6)];b.wa=s.wa;}
  if(lk.sheath){b.aB=[.1-.6*cB,1.8];b.hB=3;}
  return b;
}

function fighterPose(f,dt){
  const s=f.st,lk=f.ch.lk;
  if(s==='atk'&&f.atk){
    const a=f.atk,base=POSE[a.pose+'_w']?a.pose:'punch';
    const w=POSE[base+'_w'],st=POSE[base+'_s'],id=f.onG?stanceOf(f):POSE.fall;
    // 4 phases: anticipate -> SNAP -> follow-through overshoot -> settle
    if(a.t<a.d)          return hl(mixPose(id,w,eOut(a.t/a.d)));
    if(a.t<a.d+a.a)      return hl(mixPose(w,st,eSnap((a.t-a.d)/a.a)));
    const rp=clamp((a.t-a.d-a.a)/a.r,0,1), ov=overshoot(w,st,.17);
    if(rp<.40)           return hl(mixPose(st,ov,eOut(rp/.40)));
    return hl(mixPose(ov,id,eInOut((rp-.40)/.60)));
  }
  if(s==='ultstart'||s==='ult')return ultPose(f);
  if(s==='run')return gaitPose(f,dt,false);
  if(s==='sprint')return gaitPose(f,dt,true);
  if(s==='jump'){const p=clamp((f.vy+800)/800,0,1);
    return hl(lk.move==='float'?gaitPose(f,dt,false):mixPose(POSE.jump,POSE.fall,p*.6));}
  if(s==='fall')return hl(lk.move==='float'?gaitPose(f,dt,false):POSE.fall);
  if(s==='ffall')return hl(POSE.ffall);
  if(s==='prejump')return POSE.prejump;
  if(s==='crouch')return POSE.crouch;
  if(s==='block')return POSE.block;
  if(s==='hurt'){
    if(!f.onG&&f.launch)return POSE.tumble;
    const q=clamp(f.hurtT/.4,0,1),hi=f.hitH<-95,lo=f.hitH>-50;
    const b=copyPose(lo?POSE.hurtlo:POSE.hurt);
    if(hi){b.head=-.6;b.lean-=.15;}
    b.lean=b.lean*(.55+q*.55)+Math.sin(T*46)*q*.05;
    b.ty-=q*2;return b;}
  if(s==='down')return POSE.down;
  if(s==='getup'){const q=clamp(f.t/.34,0,1);return kf(q,[[0,POSE.down],[.45,POSE.kneel],[1,stanceOf(f)]],eOut);}
  if(s==='dash')return hl(POSE.dash);
  if(s==='adash')return hl(POSE.adash);
  if(s==='sdash')return POSE.sdash;
  if(s==='wall')return POSE.wall;
  if(s==='skid')return POSE.skid;
  if(s==='win'){const b=copyPose(VICTORY[f.ch.id]);const br=Math.sin(T*2.2);b.ty+=br*1.2;b.aB[0]+=br*.04;return b;}
  if(s==='ko')return POSE.down;
  const b=idlePose(f,T);
  if(f.landT>0)return mixPose(b,POSE.land,clamp(f.landT/.12,0,1)*.8);
  return b;
}

/* ---- per-frame: blend the live pose, record smear history + weapon trail ---- */
function animFighter(f,dt){
  if(!f.ch)return;
  const tgt=fighterPose(f,dt);
  if(!f.pose)f.pose=copyPose(tgt);
  else{
    const a=f.atk,strike=f.st==='atk'&&a&&a.t>=a.d-.01&&a.t<a.d+a.a+.02;
    const rate=f.st==='atk'?(strike?90:34):/hurt|sdash|prejump|down|dash/.test(f.st)?38:(f.st==='run'||f.st==='sprint')?24:14;
    f.pose=mixPose(f.pose,tgt,1-Math.exp(-rate*dt));
    f.pose.hF=tgt.hF;f.pose.hB=tgt.hB;f.pose.ex=tgt.ex;
  }
  // smear multiples on the strike frames
  const a=f.atk;
  if(f.st==='atk'&&a&&a.t>a.d-.03&&a.t<a.d+a.a+.06&&a.kind!=='sp'){f.poseHist.push({p:copyPose(f.pose),l:.07});if(f.poseHist.length>4)f.poseHist.shift();}
  for(let i=f.poseHist.length-1;i>=0;i--){f.poseHist[i].l-=dt;if(f.poseHist[i].l<=0)f.poseHist.splice(i,1);}
  // weapon / limb trail (world space)
  if(f.st==='atk'&&a&&a.t<a.d+a.a+.08&&a.kind!=='sp'){
    const leg=/kick|knee|divekick/.test(a.pose);
    const S=PS*f.ch.h,K=skel(f.ch,f.pose,S,{plant:f.onG});
    let inn,tip;
    if(leg){inn=K.lF.k;tip=add(K.lF.a,dirA(K.lF.A2),4*S);}
    else{const wl=(WEP_LEN[f.ch.wep]||9)*S,th=Math.PI/2-K.aF.A2+(f.pose.wa||0);
      tip=[K.aF.h[0]+Math.cos(th)*wl,K.aF.h[1]+Math.sin(th)*wl];
      inn=f.ch.wep==='none'||f.ch.wep==='claw'||f.ch.wep==='shield'?lerpP(K.aF.h,K.aF.e,.25):[K.aF.h[0]+Math.cos(th)*wl*.25,K.aF.h[1]+Math.sin(th)*wl*.25];}
    const w=(p)=>[f.x+f.face*p[0],f.y+p[1]];
    f.trail.push({i:w(inn),o:w(tip),l:.13,m:.13});
    if(f.trail.length>14)f.trail.shift();
  }
  for(let i=f.trail.length-1;i>=0;i--){f.trail[i].l-=dt;if(f.trail[i].l<=0)f.trail.splice(i,1);}
}

/* ---------------- fighter drawing ---------------- */
function bodyOpts(f,extra){
  const C=f.ch,lk=C.lk;
  return Object.assign({vx:f.vx*f.face,vy:f.vy,sway:f.sway,sq:f.squash*.6-f.stretch*.5,
    spin:(f.spinT>0?(1-f.spinT/.36)*TAU:0)+f.spinX,cloth:f.cloth,dt:f._dt||0,
    plant:f.onG&&f.st!=='down'&&f.st!=='getup',
    floatK:f.st==='down'||f.st==='getup'||f.st==='hurt'?0:1,
    sheathed:lk.sheath&&f.drawnT<=0&&f.st!=='atk'&&f.st!=='ultstart'&&f.st!=='ult'},extra||{});
}
function silhouette(f,po,x,y,face,a,col,t){
  X.save();X.globalAlpha=a;X.globalCompositeOperation='lighter';
  X.translate(x,y);X.scale(face,1);
  RL=1;try{withTint(col,.72,()=>drawBody(X,f.ch,po,PS,t,{nosim:1,plant:1,floatK:1,noWep:0}));}finally{RL=0;}
  X.restore();
}
function drawSwoosh(f){
  const tr=f.trail;if(tr.length<2)return;
  const col=f.atk?f.atk.col:f.ch.c3;
  X.save();X.globalCompositeOperation='lighter';
  for(let i=1;i<tr.length;i++){const a=tr[i-1],b=tr[i],age=clamp(b.l/b.m,0,1),k=i/tr.length;
    X.globalAlpha=age*k*.75;X.fillStyle=col;
    X.beginPath();X.moveTo(a.i[0],a.i[1]);X.lineTo(a.o[0],a.o[1]);X.lineTo(b.o[0],b.o[1]);X.lineTo(b.i[0],b.i[1]);X.closePath();X.fill();}
  X.lineCap='round';X.lineJoin='round';
  for(const pass of[0,1]){X.beginPath();tr.forEach((q,i)=>i?X.lineTo(q.o[0],q.o[1]):X.moveTo(q.o[0],q.o[1]));
    X.globalAlpha=clamp(tr[tr.length-1].l/tr[tr.length-1].m,0,1)*(pass?.95:.5);
    X.strokeStyle=pass?'#ffffff':col;X.lineWidth=pass?3:9;X.stroke();}
  X.restore();
}
function drawFighter(f,t){
  const C=f.ch;
  for(const g of f.ghost){const po=typeof g.pose==='string'?(POSE[g.pose]||stanceOf(f)):g.pose;
    silhouette(f,po,g.x,g.y,g.face,(g.l/g.m)*.45,C.c3,t);}
  for(const h of f.poseHist)silhouette(f,h.p,f.x-f.face*6*(1-h.l/.07),f.y,f.face,clamp(h.l/.07,0,1)*.35,'#ffffff',t);
  drawSwoosh(f);
  const sh=clamp(1-(GY-f.y)/320,.25,1);
  X.save();X.globalAlpha=.42*sh;X.fillStyle='#000';X.beginPath();
  X.ellipse(f.x,GY+2,(f.st==='down'?62:40)*sh,10*sh,0,0,TAU);X.fill();X.restore();
  X.save();X.translate(f.x,f.y);X.scale(f.face,1);
  if(f.rot){X.translate(0,-60);X.rotate(f.rot);X.translate(0,60);}
  const casting=f.st==='ultstart'||f.st==='ult';
  if(f.meter>=100||casting||f.st==='sdash'){X.save();X.globalCompositeOperation='lighter';
    const r=casting?lerp(80,150,Math.sin(t*6)*.5+.5):f.st==='sdash'?110:70;
    X.globalAlpha=casting?.8:f.st==='sdash'?.7:.45;
    X.drawImage(glowSprite(C.c3),-r,-66-r,r*2,r*2);X.restore();
    if(Math.random()<(casting?.9:.3))pt(f.x+rnd(34,-34),f.y-rnd(20,0),rnd(40,-40),-rnd(280,90),.6,rnd(7,3),C.c3,'orb',-160);}
  if(f.buffT>0){X.save();X.globalCompositeOperation='lighter';
    X.globalAlpha=.3+Math.sin(t*9)*.12;X.drawImage(glowSprite(C.c3),-60,-130,120,140);X.restore();
    if(Math.random()<.3)bolt(f.x+rnd(30,-30),f.y-rnd(130,40),f.x+rnd(40,-40),f.y-rnd(100,10),C.c3,.4);}
  const draw=()=>drawBody(X,C,f.pose||stanceOf(f),PS,t,bodyOpts(f));
  if(f.flashT>0)withTint(f.flashC,.8,draw);else draw();
  X.restore();
  if(f.guard>0||f.guardFX>0){                         // guard bubble
    X.save();X.globalCompositeOperation='lighter';
    X.globalAlpha=(f.guardFX>0?.6:.28)+Math.sin(t*12)*.05;
    X.strokeStyle='#bcd0ff';X.lineWidth=3;
    X.beginPath();X.ellipse(f.x+f.face*8,f.y-62,36,64,0,0,TAU);X.stroke();
    X.globalAlpha*=.28;X.fillStyle='#8fb4ff';X.fill();X.restore();}
}
function reflectFighter(f){
  X.save();X.translate(f.x,GY+(GY-f.y)*.5);X.scale(f.face,-.5);
  RL=1;try{drawBody(X,f.ch,f.pose||stanceOf(f),PS,T,bodyOpts(f,{nosim:1,cloth:f.cloth}));}finally{RL=0;}
  X.restore();
}

/* ---------------- training dummy ---------------- */
function drawDummy(t){
  const sh=clamp(1-(GY-dum.y)/300,.25,1);
  X.save();X.globalAlpha=.4*sh;X.fillStyle='#000';X.beginPath();
  X.ellipse(dum.x,GY+2,42*sh,10*sh,0,0,TAU);X.fill();X.restore();
  X.save();X.translate(dum.x,dum.y);X.rotate(dum.wob*.5+dum.rot);
  if(dum.flashT>0)withTint(dum.flashC,.8,()=>dummyArt(X,dum.wob));else dummyArt(X,dum.wob);
  X.restore();
}
function dummyArt(c,wob){
  c.save();c.lineJoin='round';
  const ink=tc('#1a140c');c.lineWidth=2.4;c.strokeStyle=ink;
  c.fillStyle=tc('#2a2f3f');c.beginPath();c.ellipse(0,0,34,10,0,0,TAU);c.fill();c.stroke();
  c.fillStyle=tc('#1a1e2b');c.beginPath();c.ellipse(0,-4,28,8,0,0,TAU);c.fill();
  c.fillStyle=tc('#3a4052');c.fillRect(-6,-40,12,40);c.strokeRect(-6,-40,12,40);
  const g=c.createLinearGradient(-28,0,28,0);
  g.addColorStop(0,tc('#6a5a44'));g.addColorStop(.45,tc('#b09670'));g.addColorStop(1,tc('#5a4c38'));
  c.fillStyle=g;c.beginPath();
  c.moveTo(-24,-40);c.quadraticCurveTo(-32,-90,-20,-116);
  c.quadraticCurveTo(0,-128,20,-116);c.quadraticCurveTo(32,-90,24,-40);
  c.quadraticCurveTo(0,-32,-24,-40);c.closePath();c.fill();c.stroke();
  c.fillStyle=tc('#3a3020');c.fillRect(-27,-78,54,7);c.fillRect(-25,-54,50,7);
  c.fillStyle=tc('#c8b48c');c.fillRect(-27,-78,54,2);
  c.globalAlpha*=.6;c.strokeStyle=tc('#e04a4a');c.lineWidth=3;
  c.beginPath();c.arc(0,-84,15,0,TAU);c.stroke();
  c.lineWidth=2;c.beginPath();c.arc(0,-84,8,0,TAU);c.stroke();
  c.fillStyle=tc('#e04a4a');c.beginPath();c.arc(0,-84,3.4,0,TAU);c.fill();c.globalAlpha/=.6;
  c.fillStyle=tc('#8f7a58');c.beginPath();c.arc(0,-124,13,0,TAU);c.fill();c.lineWidth=2.4;c.strokeStyle=ink;c.stroke();
  c.fillStyle=tc('#241d12');
  const eo=Math.abs(wob)>.12?2:0;
  c.beginPath();c.arc(-4.5,-126,2.2+eo,0,TAU);c.fill();
  c.beginPath();c.arc(4.5,-126,2.2+eo,0,TAU);c.fill();
  c.strokeStyle=tc('#241d12');c.lineWidth=1.6;c.beginPath();
  c.arc(0,-118,4.5,0,Math.PI);c.stroke();
  c.restore();
}

/* =======================================================================
   ULTIMATES (gameplay side)
   U at 100% -> super flash (world freezes, portrait cut-in) -> a real startup
   move in gameplay. ONLY if that startup connects does the cutscene play;
   a whiff or a block just burns the meter. That keeps cinematics rare.
   ======================================================================= */
const ULTS={
 kage:   {type:'rush',spd:1150,dur:.34,reach:78,pose:['seal_w','seal_s']},
 reika:  {type:'rush',spd:1550,dur:.24,reach:96,pose:['iai_w','swing_s']},
 vanta:  {type:'shot',spd:1600,r:12,pose:['shoot_w','shoot_s'],k:'grapple'},
 aegis:  {type:'rush',spd:1150,dur:.36,reach:84,pose:['shieldbash_w','tackle_s']},
 pyra:   {type:'area',delay:.3,min:110,max:480,w:84,pose:['skypoint_w','skypoint_s']},
 null9:  {type:'shot',spd:1500,r:16,pose:['shoot_w','shoot_s'],k:'fist'},

const ULT_REACH=f=>{const u=ULTS[f.ch.id];return u.type==='rush'?u.spd*u.dur+u.reach:u.type==='area'?u.max:W*.8;};

/* =======================================================================
   CINEMATIC ENGINE
   A cutscene is a list of shots. Each shot owns a duration, a camera (in "set"
   coordinates: origin on the floor at screen centre, +x forward), an optional
   screen-space backdrop, a draw() for actors/props and an over() for screen-
   space panels, cut-ins and lettering. Particles/effects spawned inside a
   shot live in their own pools and are wiped on every cut.
   ======================================================================= */
let cine=null;
function startCine(def,A,D,opts){
  const saved={parts,effs,decals,shots:shots.slice()};
  parts=[];effs=[];decals=[];
  cine={def,A,D,t:0,i:-1,st:0,dt:0,saved,cl:{A:{},D:{}},data:{},opts:opts||{},hits:0,dmg:0,imp:0,fz:0,lastHit:-9};
  cam.sh=0;cam.flash=0;
  cineNext();
}
function cineNext(){
  const C=cine;C.i++;C.st=0;parts.length=0;effs.length=0;decals.length=0;C.cl={A:{},D:{}};
  if(C.i>=C.def.shots.length){endCine();return;}
  const sh=C.def.shots[C.i];if(sh.enter)sh.enter(C);
}
function endCine(){
  const C=cine;cine=null;
  parts=C.saved.parts;effs=C.saved.effs;decals=C.saved.decals;
  cam.dark=0;cam.letter=0;cam.slow=1;cam.focus=null;
  if(C.def.end)C.def.end(C);
}
function skipCine(){if(cine&&cine.opts.skippable){while(cine&&cine.i<cine.def.shots.length-1){cineNext();}if(cine)cine.st=cine.def.shots[cine.i].d;}}
function updCine(rdt){
  const C=cine,sh=C.def.shots[C.i];
  let sp=typeof sh.slow==='function'?sh.slow(clamp(C.st/sh.d,0,1)):(sh.slow||1);
  if(C.fz>0){C.fz-=rdt;sp*=.04;}                        // micro hit-freeze inside the cutscene
  const dt=rdt*sp;
  C.st+=dt;C.t+=rdt;C.dt=dt;
  if(sh.tick)sh.tick(C,clamp(C.st/sh.d,0,1),dt);
  if(sh.world){if(sh.focus)cam.focus=sh.focus(C);updCamera(rdt);}
  updParts(dt);
  cam.sh*=Math.pow(.02,rdt);cam.flash*=Math.pow(.0006,rdt);post.impact=Math.max(0,post.impact-rdt);post.lines=Math.max(0,post.lines-rdt);
  if(cine&&C.st>=sh.d)cineNext();
}
function drawCine(){
  const C=cine,sh=C.def.shots[C.i],q=clamp(C.st/sh.d,0,1);
  X.setTransform(DPR,0,0,DPR,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';
  X.fillStyle='#05060c';X.fillRect(0,0,W,H);
  if(sh.world){drawWorld(T);}
  else{
    const cm=sh.cam?sh.cam(q,C):{x:0,y:-80,z:2,r:0};C.cm=cm;
    if(sh.bg)sh.bg(X,q,C);
    X.save();
    const sx=rnd(cam.sh,-cam.sh),sy=rnd(cam.sh,-cam.sh);
    X.translate(W/2+sx,H/2+sy);X.rotate(cm.r||0);X.scale(cm.z,cm.z);X.translate(-(W/2+cm.x),-(GY+cm.y));
    if(sh.stage){const ox=cam.cx;cam.cx=W/2+cm.x;drawBG(T);cam.cx=ox;}
    X.translate(W/2,GY);
    if(sh.draw)sh.draw(X,q,C);
    drawEffs(false);drawParts();drawEffs(true);
    if(sh.draw2)sh.draw2(X,q,C);
    X.restore();
  }
  if(sh.over){X.save();sh.over(X,q,C);X.restore();}
  finishFrame(true);
  // cinematic bars + running damage
  const b=H*.075;X.fillStyle='#000';X.fillRect(0,0,W,b);X.fillRect(0,H-b,W,b);
  if(C.hits>0&&!C.opts.noCount){
    X.save();X.textAlign='right';X.font='italic 900 30px "Arial Black",Impact,sans-serif';
    const x=W-40,y=H-b-22,a=clamp(C.t-C.lastHit<.12?1:1,0,1);X.globalAlpha=a;
    X.lineWidth=6;X.strokeStyle='#000';X.strokeText(C.hits+' HITS',x,y-26);
    const g=X.createLinearGradient(0,y-56,0,y-26);g.addColorStop(0,'#fff');g.addColorStop(1,C.A.ch.ult.c);X.fillStyle=g;X.fillText(C.hits+' HITS',x,y-26);

    X.restore();
  }
}

/* ---------------- shot helpers ---------------- */
const isDummyF=f=>f===dum&&isDummy();
function cp(name,ov){const b=copyPose(typeof name==='string'?(POSE[name]||STANCE[name]||VICTORY[name]||POSE.idle):name);return ov?Object.assign(b,ov):b;}
function actA(C,po,x,y,sc,face,o){drawActor(C.A,C.cl.A,C,po,x,y,sc,face,o);}
function actD(C,po,x,y,sc,face,o){
  if(isDummyF(C.D)){X.save();X.translate(x,y);X.scale((sc||PS)/PS*face,(sc||PS)/PS);X.rotate((o&&o.rot)||0);
    const dr=()=>dummyArt(X,(o&&o.wob)||Math.sin(C.t*30)*.2);
    if(o&&o.tint)withTint(o.tint[0],o.tint[1],dr);else dr();X.restore();return;}
  drawActor(C.D,C.cl.D,C,po,x,y,sc,face,o);
}
function drawActor(f,cl,C,po,x,y,sc,face,o){
  o=o||{};X.save();X.translate(x,y);X.scale(face||1,1);
  if(o.rot){X.translate(0,-60*(sc||PS)/PS);X.rotate(o.rot);X.translate(0,60*(sc||PS)/PS);}
  const opt=Object.assign({cloth:cl,dt:C.dt,vx:o.vx||0,vy:o.vy||0,plant:o.plant!==undefined?o.plant:1,sheathed:o.sheathed,floatK:o.floatK},o.opt||{});
  const dr=()=>drawBody(X,f.ch,po,sc||PS,C.t,opt);
  if(o.sil){RL=1;try{withTint(o.sil,1,dr);}finally{RL=0;}}
  else if(o.tint)withTint(o.tint[0],o.tint[1],dr);else dr();
  X.restore();
}
/* land a hit inside the cutscene: counts, damage share, spark, micro freeze */
function chit(C,frac,x,y,col,big,dir){
  C.hits++;C.dmg+=C.A.ch.ult.dmg*frac;C.lastHit=C.t;
  hitSpark(x,y,dir||1,col||C.A.ch.ult.c,big?30:12,big);
  burst(x,y,big?16:8,'#ffffff',big?520:320,big?5:3,'spark',300);

}
function camLerp(q,a,b,ef){const e=(ef||eInOut)(q);return{x:lerp(a[0],b[0],e),y:lerp(a[1],b[1],e),z:lerp(a[2],b[2],e),r:lerp(a[3]||0,b[3]||0,e)};}

/* ---------------- backdrops (screen space) ---------------- */
function bgGrad(c,top,bot){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(0,0,W,H);}
function bgRadial(c,c1,c2,cx,cy,t,lineCol,inner){
  const g=c.createRadialGradient(cx,cy,10,cx,cy,Math.max(W,H)*.8);g.addColorStop(0,c1);g.addColorStop(.55,mixC(hx(c1).length?c2:c2,c2,0));g.addColorStop(1,c2);
  c.fillStyle=g;c.fillRect(0,0,W,H);
  speedLines(cx,cy,lineCol||'rgba(255,255,255,.9)',.4,inner||Math.min(W,H)*.18,Math.floor(t*24),90);
}
function bgStreaks(c,c1,c2,t,dir,col){
  bgGrad(c,c1,c2);c.save();c.globalAlpha=.7;c.fillStyle=col||'rgba(255,255,255,.8)';
  for(let i=0;i<46;i++){const y=hash(i*1.7)*H,L=W*(.2+hash(i*3.1)*.5),sp=W*2.6*(.6+hash(i));
    const x=((hash(i*9.1)*W*3+t*sp*dir)%(W*2.2)+W*2.2)%(W*2.2)-W*.6;
    c.fillRect(dir>0?x:W-x-L,y,L,1+hash(i*5)*3);}
  c.restore();
}
function bgSpace(c,t,tint){
  bgGrad(c,'#02010a','#0a0624');
  const g=c.createRadialGradient(W*.62,H*.4,10,W*.62,H*.4,W*.6);g.addColorStop(0,rgba(tint||'#7a3aff',.45));g.addColorStop(1,rgba(tint||'#7a3aff',0));

  c.fillStyle='#ffffff';for(let i=0;i<180;i++){const a=.35+.65*Math.abs(Math.sin(t*2+i));c.globalAlpha=a;
    c.fillRect(hash(i*2.3)*W,hash(i*7.7)*H,hash(i)*2.2+.4,hash(i)*2.2+.4);}
  c.globalAlpha=1;

let _halftone=null;
function halftone(c,col,a){
  if(!_halftone){const s=document.createElement('canvas');s.width=s.height=10;const g=s.getContext('2d');
    g.fillStyle='#000';g.beginPath();g.arc(5,5,2.2,0,TAU);g.fill();_halftone=c.createPattern(s,'repeat');}
  c.save();c.globalAlpha=a;c.globalCompositeOperation='multiply';c.fillStyle=_halftone;c.fillRect(0,0,W,H);

/* comic panel: clip to a polygon, draw inside, then ink the gutter */

  c.save();c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.clip();
  fn();c.restore();
  c.save();c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();
  c.lineJoin='miter';c.lineWidth=10;c.strokeStyle=border||'#ffffff';c.stroke();c.lineWidth=3;c.strokeStyle='#000';c.stroke();c.restore();
}
/* a mini scene inside a panel, drawn with its own camera */
function inPanel(c,cm,fn){c.save();c.translate(W/2,H/2);c.rotate(cm.r||0);c.scale(cm.z,cm.z);c.translate(-cm.x,-cm.y);fn();c.restore();}
/* onomatopoeia: pops in with overshoot, heavy outline */
function sfx(c,str,x,y,size,col,rot,q,col2){

  c.lineWidth=size*.28;c.strokeStyle='#000';c.strokeText(str,0,0);
  c.lineWidth=size*.12;c.strokeStyle=col2||'#fff';c.strokeText(str,0,0);

/* eye cut-in: a letterboxed strip across the screen holding the fighter's eyes */
function eyesCut(c,f,q,o){
  o=o||{};const ch=f.ch,cy=o.y||H*.5,h=o.h||H*.2,face=o.face||1;
  const open=eOut(clamp(q/.14,0,1)),close=clamp((q-.86)/.14,0,1),hh=h*open*(1-close);
  if(hh<1)return;
  c.save();c.beginPath();c.rect(0,cy-hh/2,W,hh);c.clip();
  bgRadial(c,rgba(ch.c3,.55),'#07060e',W*.5,cy,C_T(),rgba('#ffffff',.5),h*.4);
  const S=h*(o.big||1.15)/(G.HR*ch.h);                          // head radius ~ 1.15*h
  const po=cp(o.pose||stanceOf(f),{lean:0,cb:0,head:0,ex:o.ex||'f',aF:[-.2,.4],aB:[.2,.4]});
  const K=skel(ch,po,S*ch.h,{});
  const zoom=1+q*.08;
  c.translate(W*.5,cy);c.scale(face*zoom,zoom);
  c.translate(-(K.head[0]+.58*G.HR*S*ch.h),-(K.head[1]+.18*G.HR*S*ch.h));
  drawBody(c,ch,po,S,C_T(),{nosim:1,floatK:0,sheathed:1});
  c.restore();
  c.save();c.fillStyle='#000';c.fillRect(0,cy-hh/2-3,W,4);c.fillRect(0,cy+hh/2-1,W,4);
  c.fillStyle=ch.c3;c.fillRect(0,cy-hh/2-7,W*open,2);c.fillRect(W*(1-open),cy+hh/2+4,W,2);c.restore();
}
const C_T=()=>cine?cine.t:performance.now()/1000;
/* portrait: the fighter's bust inside whatever clip is active (used by the super flash) */
function portrait(c,f,cx,cy,headR,ex,face,po){
  const ch=f.ch,S=headR/G.HR/ch.h;
  const pp=cp(po||stanceOf(f),{ex:ex||'s',lean:.05,cb:0,head:0});
  const K=skel(ch,pp,S*ch.h,{});
  c.save();c.translate(cx,cy);c.scale(face||1,1);c.translate(-K.head[0],-K.head[1]);
  drawBody(c,ch,pp,S,C_T(),{nosim:1,floatK:0,sheathed:ch.lk.sheath?1:0});

/* ---------------- the super flash (gameplay freeze + cut-in band) ---------------- */
function drawSuperCutIn(sf){
  const f=sf.f,ch=f.ch,q=clamp(sf.t/sf.dur,0,1),left=f.x<f.foe.x?1:-1;
  const inK=eOut(clamp(q/.2,0,1)),outK=eIn(clamp((q-.8)/.2,0,1));
  X.save();
  X.fillStyle='rgba(3,4,12,'+(.62*(1-outK))+')';X.fillRect(0,0,W,H);
  const bh=H*.36,y0=H*.3,sl=bh*.28,off=(1-inK)*W*left*-1.1+outK*W*left*1.1;
  X.translate(off,0);
  const band=[[-20,y0+sl],[W+20,y0-sl*.2],[W+20,y0+bh-sl],[-20,y0+bh+sl*.25]];
  panel(X,band,()=>{
    bgRadial(X,rgba(ch.c3,.9),rgba(ch.c1,.95),left>0?W*.28:W*.72,y0+bh*.5,performance.now()/1000,rgba('#ffffff',.7),bh*.3);
    halftone(X,null,.18);
    portrait(X,f,left>0?W*.27:W*.73,y0+bh*.46,bh*.34,'s',left,POSE[ULTS[ch.id].pose[0]]);
  },'#ffffff');
  // move name + fighter
  const fs=Math.min(78,W*.06);
  X.font='italic 900 '+fs+'px "Arial Black",Impact,sans-serif';
  const tw=X.measureText(ch.ult.n).width,sc2=Math.min(1,W*.5/tw);
  X.save();X.translate(left>0?W*.72:W*.28,y0+bh*.52);X.rotate(-.06);X.scale(sc2,sc2);
  X.textAlign='center';X.lineJoin='round';
  X.lineWidth=14;X.strokeStyle='#000';X.strokeText(ch.ult.n,0,0);
  X.lineWidth=5;X.strokeStyle='#fff';X.strokeText(ch.ult.n,0,0);

  const poly=(px,pw)=>{X.beginPath();X.moveTo(px,y);X.lineTo(px+pw+k,y);X.lineTo(px+pw,y+h);X.lineTo(px-k,y+h);X.closePath();};
  X.save();
  poly(sx-4,w+8);X.fillStyle='rgba(4,6,14,.85)';X.fill();
  poly(sx,w);X.fillStyle='rgba(255,255,255,.08)';X.fill();X.clip();
  if(trail!==undefined){const tw=w*clamp(trail,0,1);X.fillStyle='#ff3b4e';X.fillRect(dir>0?sx:sx+w-tw,y,tw,h);}
  const pw=w*clamp(p,0,1);
  const g=X.createLinearGradient(0,y,0,y+h);g.addColorStop(0,mixC(c1,'#ffffff',.35));g.addColorStop(.5,c1);g.addColorStop(1,c2);
  X.fillStyle=g;X.fillRect(dir>0?sx:sx+w-pw,y,pw,h);
  X.fillStyle='rgba(255,255,255,.35)';X.fillRect(dir>0?sx:sx+w-pw,y+1,pw,h*.22);
  X.restore();
  X.save();poly(sx,w);X.strokeStyle='rgba(255,255,255,.55)';X.lineWidth=1.5;X.stroke();X.restore();
}

function cutEnd(opts){
  opts=opts||{};
  return function(C){
    const A=C.A,D=C.D,dir=A.face;
    const total=Math.max(0,A.ch.ult.dmg*(opts.total||1)-C.dmg*0);
    A.st='idle';A.ultI=null;A.vx=0;A.spinX=0;A.y=GY;A.onG=true;A.vy=0;A.drawnT=1;
    if(opts.ax!==undefined)A.x=clamp(A.x+dir*opts.ax,50,W-50);
    D.x=clamp(A.x+dir*(opts.dx||130),50,W-50);
    A.face=D.x>A.x?1:-1;
    if(isDummyF(D)){dum.air=true;dum.y=GY-(opts.dy||0);dum.vy=opts.up?-520:-240;dum.vx=dir*(opts.kb||260);dum.rotV=dir*8;}

    const dealt=dealDmg(total,A.ch.ult.c,true,D,A);
    num(D.x,D.y-170,dealt,A.ch.ult.c2,true);

     const h=handW(C.A,po,-40,y,1);spiralOrb(c,h[0]+14,h[1],lerp(10,58,eOut(q)),C.t,C.A.ch.ult.c,C.A.ch.ult.c2);}},
  {d:1.35,                                                  // SPIRAL CATACLYSM: the dome
   stage:1,
   cam:q=>({x:0,y:-120,z:lerp(1.35,1.08,eOut(q)),r:0}),
   enter(C){later0(C,.06,()=>{chit(C,.3,0,-70,C.A.ch.ult.c,true,1);flash('#ffffff',.9);crack(0,2.2,'#ffcf7a');
       for(let i=0;i<70;i++){const a=rnd(Math.PI,0);pt(0,-10,Math.cos(a)*rnd(900,200)*(Math.random()<.5?1:-1),-Math.sin(a)*rnd(800,200),rnd(1.2,.5),rnd(9,4),i%2?'#ffcf7a':'#ffffff','shard',900);}
       dust(0,20,0,2.2);});
     for(let i=0;i<6;i++)later0(C,.2+i*.12,()=>{chit(C,.055,rnd(60,-60),-rnd(160,40),C.A.ch.ult.c,false,1);});},
   tick(C,q,dt){cineLater(C,dt);if(Math.random()<.6)pt(rnd(300,-300),0,rnd(80,-80),-rnd(320,80),1,rnd(26,12),'#b9a38a','smoke',-40);},
   draw(c,q,C){
     const R=lerp(40,380,eOut(clamp(q/.55,0,1))),a=1-clamp((q-.6)/.4,0,1);
     c.save();c.fillStyle='rgba(0,0,0,.55)';c.beginPath();c.ellipse(0,4,R*.9,R*.14,0,0,TAU);c.fill();c.restore();
     actD(C,cp('down'),30,0,PS,-1,{});
     actA(C,cp('seal_s',{lean:.7,ty:10,ex:'s'}),-30,0,PS,1,{});
     c.save();c.globalAlpha=a;spiralOrb(c,0,-R*.45,R*.62,C.t,C.A.ch.ult.c,C.A.ch.ult.c2);c.restore();
     c.save();c.globalCompositeOperation='lighter';c.globalAlpha=a*.8;c.strokeStyle='#ffffff';c.lineWidth=6;
     for(let k=0;k<3;k++){c.beginPath();c.ellipse(0,-R*.3,R*(1+k*.2),R*(.3+k*.05),0,0,TAU);c.stroke();}c.restore();},
   over(c,q,C){sfx(c,'KA-BOOOM!!',W*.5,H*.24,Math.min(120,W*.09),'#ffcf7a',-.05,clamp(q*1.4,0,1));}},
 ],end:cutEnd({dx:120})};

/* ---------------- generic fallback (any fighter without a bespoke cut) ---------------- */
function genericCut(){return{shots:[
  confirmShot(.4,'!!'),
  {d:.6,bg:(c,q,C)=>bgGrad(c,'#05060c','#0b0d1c'),over(c,q,C){eyesCut(c,C.A,q,{h:H*.26,ex:'s'});}},
  {d:1.2,bg:(c,q,C)=>bgRadial(c,rgba(C.A.ch.ult.c,.9),'#05060c',W*.5,H*.5,q*3),
   cam:q=>({x:0,y:-80,z:lerp(2.2,1.6,eOut(q)),r:.05}),
   enter(C){for(let i=0;i<8;i++)later0(C,.1+i*.09,()=>chit(C,.08,rnd(60,20),-rnd(120,40),C.A.ch.ult.c,i===7,1));},
   tick(C,q,dt){cineLater(C,dt);},
   draw(c,q,C){actD(C,cp('hurt',{ex:'h'}),60,0,PS,-1,{});actA(C,kf(q,[[0,'ult_w'],[.2,'ult_s'],[1,'ult_s']]),-60,0,PS,1,{});}}],
  end:cutEnd({dx:120})};}
R.forEach(c=>{if(!CUTS[c.id])CUTS[c.id]=genericCut();});

/* ---------------- main loop ---------------- */
let showMoves=false;
let T=0,last=performance.now(),running=false;
const NOIN=blankInput();
function updPlayer(dt,lock){
  updFighter(pl,dt,lock?NOIN:playerInput());
  if(press['m'])pl.meter=100;
  if(press['r'])resetDummy();
  if(press['h'])showHelp=!showHelp;
}
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.045,(now-last)/1000);last=now;
  const rdt=dt;
  if(!running)return;
  if(W!==innerWidth||H!==innerHeight)onResize();   // self-heal any layout change
  if(cine){
    if(cine.opts.skippable&&(press['j']||press['k']||press[' ']||press['enter']))skipCine();
    if(cine)updCine(rdt);
    if(cine)drawCine();
    for(const k in press)delete press[k];
    return;
  }
  if(superFlash){
    superFlash.t+=rdt;animFighter(superFlash.f,rdt*.5);
    if(superFlash.t>=superFlash.dur)superFlash=null;
  } else {
    if(hitstop>0){hitstop-=dt;dt*=.06;}
    dt*=cam.slow;
    T+=dt;spCd=Math.max(0,spCd-dt);
    tickTimers(dt);
    let lock=false;
    if(roundBanner){roundBanner.t+=rdt;lock=!isDummy()&&roundBanner.t<.85;if(roundBanner.t>1.6)roundBanner=null;}
    if(koT>0){updKO(rdt);updFighter(pl,dt,NOIN);}
    else updPlayer(dt,lock);
    if(lock&&dum.brain){updDummy(0);updFighter(dum,dt,NOIN);}else updDummy(dt);
    if(koT>0&&!isDummy()&&dum.brain){}               // AI is idled by aiInput during KO
    updHits(dt);
    animFighter(pl,dt);animFighter(dum,dt);
    updParts(dt);
    for(let i=nums.length-1;i>=0;i--){const n=nums[i];n.l-=dt;n.y+=n.vy*dt;n.vy+=180*dt;n.pop+=dt;if(n.l<=0)nums.splice(i,1);}
  }
  cam.sh*=Math.pow(.02,rdt);cam.flash*=Math.pow(.0006,rdt);
  post.impact=Math.max(0,post.impact-rdt);post.lines=Math.max(0,post.lines-rdt);
  for(const k in press)delete press[k];
  updCamera(rdt);
  drawWorld(T);
  finishFrame(false);
  drawHUD(T);
  if(superFlash)drawSuperCutIn(superFlash);
  drawRoundBanner();
  if(koT>0)drawKO();
  if(showMoves)drawMoveList();
}
function drawWorld(t){
  X.setTransform(DPR,0,0,DPR,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';
  X.clearRect(0,0,W,H);
  const sx=rnd(cam.sh,-cam.sh),sy=rnd(cam.sh,-cam.sh);
  X.save();
  X.translate(W/2+sx,H/2+sy);X.rotate(cam.rot);X.scale(cam.zz,cam.zz);X.translate(-cam.cx,-cam.cy);
  drawBG(t);
  drawDecals();
  if(cam.dark>0){X.fillStyle=rgba('#05060c',cam.dark);X.fillRect(-W,-H,W*3,H*3);}
  drawEffs(false);
  // floor reflections
  X.save();X.beginPath();X.rect(-W,GY,W*3,H*2);X.clip();X.globalAlpha=.16;
  if(isDummy()){X.save();X.translate(dum.x,GY+(GY-dum.y)*.5);X.scale(1,-.5);X.rotate(dum.wob*.5+dum.rot);dummyArt(X,dum.wob);X.restore();}
  else reflectFighter(dum);
  reflectFighter(pl);
  X.restore();
  // the attacker draws on top
  const front=pl.st==='atk'||pl.st==='ultstart'?pl:dum.st==='atk'?dum:pl;
  const back=front===pl?dum:pl;
  if(back===dum&&isDummy())drawDummy(t);else drawFighter(back,t);
  if(front===dum&&isDummy())drawDummy(t);else drawFighter(front,t);
  drawShots();
  drawParts();
  drawEffs(true);
  // damage numbers
  X.save();X.textAlign='center';X.lineJoin='round';
  for(const n of nums){const a=clamp(n.l/n.m,0,1),s=n.s*(n.pop<.08?1+ (0.08-n.pop)*6:1);
    X.globalAlpha=a;X.font='italic 900 '+s+'px '+HF;
    X.lineWidth=6;X.strokeStyle='rgba(0,0,0,.75)';X.strokeText(n.v,n.x+n.ox,n.y);
    const g=X.createLinearGradient(0,n.y-s,0,n.y);g.addColorStop(0,'#fff');g.addColorStop(1,n.c);
    X.fillStyle=g;X.fillText(n.v,n.x+n.ox,n.y);}
  X.restore();
  X.restore(); // camera
}
function finishFrame(inCine){
  X.setTransform(DPR,0,0,DPR,0,0);X.globalAlpha=1;X.globalCompositeOperation='source-over';
  bloom(inCine?.5:.6);
  if(post.lines>0){const a=clamp(post.lines/post.linesL,0,1);speedLines(W/2,H/2,post.linesC,.5*a,Math.min(W,H)*.34,Math.floor(T*30),60);}
  X.setTransform(DPR,0,0,DPR,0,0);
  vignette(inCine?.7:.58);
  if(cam.letter>.01){X.fillStyle='#000';const b=cam.letter*H*.11;X.fillRect(0,0,W,b);X.fillRect(0,H-b,W,b);}
  if(cam.flash>.01){X.globalAlpha=Math.min(1,cam.flash);X.fillStyle=cam.flashC;X.fillRect(0,0,W,H);X.globalAlpha=1;}
  if(post.impact>0)impactFrameFX(post.impK);
  X.setTransform(DPR,0,0,DPR,0,0);
}
/* ---------------- projectiles ---------------- */
function drawShots(){
  X.save();
  for(const s of shots){
    X.save();X.translate(s.x,s.y);X.globalCompositeOperation='lighter';
    const gl=glowSprite(s.c),gr=(s.r||12)*4;X.globalAlpha=.8;X.drawImage(gl,-gr,-gr,gr*2,gr*2);X.globalAlpha=1;
    if(s.k==='arrow'){X.rotate(Math.atan2(s.vy,s.vx));
      X.fillStyle=s.c;X.beginPath();X.moveTo(22,0);X.lineTo(-14,4);X.lineTo(-14,-4);X.closePath();X.fill();
      X.globalAlpha=.5;X.fillRect(-46,-2,36,4);}
    else if(s.k==='wave'){X.rotate(Math.atan2(s.vy,s.vx));
      X.strokeStyle=s.c;X.lineWidth=13;X.lineCap='round';
      X.beginPath();X.arc(-16,0,34,-1.15,1.15);X.stroke();
      X.strokeStyle='#fff';X.lineWidth=5;X.beginPath();X.arc(-16,0,34,-.95,.95);X.stroke();}
    else if(s.k==='disc'){X.globalCompositeOperation='source-over';X.rotate(s.t*22);
      X.strokeStyle=s.c;X.lineWidth=6;X.beginPath();X.arc(0,0,17,0,TAU);X.stroke();
      X.fillStyle='#f2f5ff';X.beginPath();X.arc(0,0,10,0,TAU);X.fill();
      X.fillStyle=s.c2;X.beginPath();X.arc(0,0,5,0,TAU);X.fill();}
    else if(s.k==='grapple'){X.globalCompositeOperation='source-over';X.restore();
      const o=s.own;X.save();X.strokeStyle='#c9d4e8';X.lineWidth=2.4;X.beginPath();X.moveTo(o.x+o.face*30,o.y-78);X.lineTo(s.x,s.y);X.stroke();
      X.translate(s.x,s.y);X.scale(s.dir,1);X.fillStyle='#d8e0f0';X.strokeStyle='#161a26';X.lineWidth=1.5;
      for(const k of[-1,1]){X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(10,k*2,14,k*10);X.lineTo(8,k*3);X.closePath();X.fill();X.stroke();}}
    else if(s.k==='fist'){X.globalCompositeOperation='source-over';X.scale(s.dir,1);
      X.fillStyle='#6e7a92';X.strokeStyle='#141a26';X.lineWidth=2;X.beginPath();X.ellipse(0,0,16,13,0,0,TAU);X.fill();X.stroke();
      X.fillStyle='#38414f';X.fillRect(-26,-9,12,18);X.globalCompositeOperation='lighter';X.drawImage(glowSprite(s.c,1),-54,-16,32,32);}
    else if(s.k==='hammer'){X.globalCompositeOperation='source-over';X.rotate(s.t*26);
      X.fillStyle='#4a3526';X.fillRect(-30,-3,52,6);X.fillStyle='#aeb9cc';X.strokeStyle='#141a26';X.lineWidth=2;
      X.fillRect(18,-15,24,30);X.strokeRect(18,-15,24,30);X.fillStyle='#e6c55a';X.fillRect(18,-4,24,8);
      if(Math.random()<.4)bolt(s.x,s.y,s.x+rnd(60,-60),s.y+rnd(60,-60),s.c,.4);}
    else if(s.k==='well'){X.globalCompositeOperation='source-over';
      const r=s.r*(1+Math.sin(s.t*12)*.08),g=X.createRadialGradient(0,0,r*.2,0,0,r*1.6);
      g.addColorStop(0,'#000');g.addColorStop(.45,'rgba(0,0,0,.9)');g.addColorStop(.6,rgba(s.c,.9));g.addColorStop(1,rgba(s.c2||s.c,0));
      X.fillStyle=g;X.beginPath();X.arc(0,0,r*1.6,0,TAU);X.fill();
      X.strokeStyle='rgba(255,255,255,.6)';X.lineWidth=2;for(let k=0;k<3;k++){X.beginPath();X.ellipse(0,0,r*(1.3+k*.3),r*(.35+k*.1),s.t*3+k,0,TAU);X.stroke();}}
    else{
      const r=s.r*(1+Math.sin(s.t*20)*.1);
      X.drawImage(glowSprite(s.c,1),-r*2.4,-r*2.4,r*4.8,r*4.8);
      if(s.k==='soul'){X.fillStyle=rgba('#ffffff',.8);X.beginPath();X.arc(-3,-3,r*.35,0,TAU);X.fill();}
      if(s.k==='serpent'){X.fillStyle='#fff';X.beginPath();X.arc(s.dir*r*.6,-r*.3,r*.18,0,TAU);X.fill();}
    }
    X.restore();
  }
  X.restore();
}

/* ---------------- select screen ---------------- */
const grid=document.getElementById('grid'),prev=document.getElementById('prev'),PX=prev.getContext('2d');
let selIdx=0;
R.forEach((c,i)=>{
  const d=document.createElement('div');d.className='card';d.style.setProperty('--c',c.c3);d.style.setProperty('--c1',c.c1);
  d.innerHTML='<div class="glow"></div><canvas width="220" height="220"></canvas>'+
    '<div class="nm">'+c.name+'</div><div class="un">'+c.uni+'</div>';
  const cc=d.querySelector('canvas').getContext('2d');
  portrait(cc,{ch:c},104,92,40,'f',1,STANCE[c.lk.stance]);
  d.onclick=()=>sel(i);
  grid.appendChild(d);
});
function sel(i){
  selIdx=i;CH=R[i];ST=STAGE[CH.id];prevCloth={};
  [...grid.children].forEach((e,j)=>e.classList.toggle('sel',j===i));
  document.getElementById('pname').textContent=CH.name;
  document.getElementById('puni').textContent=CH.uni;
  document.querySelector('.panel').style.setProperty('--c',CH.c3);
  for(const[id,v]of[['s1',CH.pow],['s2',CH.spd],['s3',CH.rng]]){
    const e=document.getElementById(id);e.style.width=clamp(v/1.4,.15,1)*100+'%';
    e.parentElement.parentElement.style.setProperty('--c',CH.c3);}
  const m=MOVES[CH.id].a, t=TILT[CH.id], s=SPX[CH.id];
  const row=(k,v,cls)=>'<div class="mv '+(cls||'')+'"><kbd>'+k+'</kbd><span>'+v+'</span></div>';
  document.getElementById('moves').innerHTML=
   row('U',CH.ult.n+' <i style="opacity:.65;font-style:normal">· cutscene</i>','ult')+
   row('L',CH.sp.n,'sp')+row('S+L',s.d.n,'sp')+row('W+L',s.u.n,'sp')+
   row('J',m[0][5]+' &rsaquo; '+m[1][5]+' &rsaquo; '+m[2][5])+
   row('K',m[3][5])+
   row('S+J',t[0][5])+row('S+K',t[1][5])+
   row('W+J',t[2][5])+row('W+K',t[3][5])+
   row('air J',t[4][5])+row('air K',t[5][5]+' <i style="opacity:.6;font-style:normal">spike</i>')+
   '<div class="stat" style="margin-top:4px"><b>ELEMENT</b><span style="color:'+EPAL[MOVES[CH.id].el].a+
     ';letter-spacing:2px;font-weight:800">'+MOVES[CH.id].el.toUpperCase()+'</span></div>';
}
/* ---- difficulty + opponent pickers ---- */
const diffrow=document.getElementById('diffrow');
AI_LEVELS.forEach((lv,i)=>{
  const b=document.createElement('button');
  b.textContent=lv.n==='TRAINING DUMMY'?'DUMMY':lv.n;
  b.onclick=()=>setDiff(i);
  diffrow.appendChild(b);
});
function setDiff(i){
  aiLvl=i;
  [...diffrow.children].forEach((e,j)=>e.classList.toggle('on',j===i));
  document.getElementById('difftag').textContent=AI_LEVELS[i].tag;
  document.getElementById('go').textContent=AI_LEVELS[i].dummy?'TRAIN':'FIGHT';
}
function setOpp(i){
  aiPick=i;
  document.getElementById('oppName').textContent=i<0?'RANDOM':R[i].name;
}
document.getElementById('oppPrev').onclick=()=>setOpp(aiPick<0?R.length-1:aiPick-1);
document.getElementById('oppNext').onclick=()=>setOpp(aiPick>=R.length-1?-1:aiPick+1);
setDiff(0);setOpp(-1);

let prevCloth={},pt0=performance.now(),plast=pt0;
(function previewLoop(now){
  requestAnimationFrame(previewLoop);
  const dt=Math.min(.05,(now-plast)/1000);plast=now;
  if(document.getElementById('select').classList.contains('hide'))return;
  const t=(now-pt0)/1000,w=prev.width,h=prev.height;
  PX.setTransform(1,0,0,1,0,0);PX.clearRect(0,0,w,h);
  const g=PX.createRadialGradient(w/2,h*.8,10,w/2,h*.8,h*.9);
  g.addColorStop(0,rgba(CH.c3,.3));g.addColorStop(1,rgba(CH.c3,0));
  PX.fillStyle=g;PX.fillRect(0,0,w,h);
  PX.globalAlpha=.35;PX.fillStyle='#000';PX.beginPath();PX.ellipse(w/2,h*.9,64,10,0,0,TAU);PX.fill();PX.globalAlpha=1;
  PX.translate(w/2,h*.9);
  const f={ch:CH,st:'idle',onG:true,landT:0};
  drawBody(PX,CH,idlePose(f,t),h/215,t,{plant:1,cloth:prevCloth,dt,sheathed:1,vx:Math.sin(t*.7)*60});
})(pt0);

function start(){
  document.getElementById('select').classList.add('hide');
  running=true;resize();
  pl.x=W*.32;pl.y=GY;pl.vx=pl.vy=0;pl.face=1;pl.st='idle';pl.meter=0;pl.ghost.length=0;pl.atk=null;pl.buffT=0;pl.inv=0;pl.chain=0;
  pl.trail.length=0;pl.jumps=1;pl.airDash=1;pl.sdAir=1;pl.spinT=pl.spinX=pl.squash=pl.stretch=pl.sway=pl.swayV=pl.skidT=0;
  parts.length=effs.length=shots.length=hits.length=nums.length=decals.length=timers.length=0;
  ult=null;cine=null;superFlash=null;koBanner=null;cam.dark=0;cam.letter=0;cam.slow=1;cam.sh=0;camReset();
  pl.ch=CH;
  dum.ch=R[aiPick>=0?aiPick:rint(R.length)];
  pl.hpMax=1000;pl.hp=1000;
  wins.p=wins.a=0;roundN=1;T=0;
  resetDummy();hpShown=hpTrail=dum.hpMax;plHpShown=plHpTrail=pl.hpMax;last=performance.now();
  if(isDummy()){roundBanner={t:0,n:1};}
  else{roundBanner=null;pl.x=W*.36;dum.x=dum.home=W*.64;startCine(INTRO,pl,dum,{skippable:1,noCount:1});}
}
function backToSelect(){running=false;cine=null;superFlash=null;document.getElementById('select').classList.remove('hide');}
document.getElementById('go').onclick=start;

addEventListener('resize',onResize);resize();
sel(0);
requestAnimationFrame(frame);
</script>
