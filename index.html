<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MULTIVERSE — Fighters</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05060c;overflow:hidden;
    font-family:"Segoe UI",Inter,system-ui,sans-serif;color:#e8ecff;
    -webkit-font-smoothing:antialiased;user-select:none}
  canvas{display:block}
  #game{position:fixed;inset:0}

  /* ---------- SELECT SCREEN ---------- */
  #select{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    background:radial-gradient(140% 100% at 50% -10%,#1b2450 0%,#0a0c1c 45%,#04050b 100%);}
  #select.hide{display:none}
  #select::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(115deg,rgba(120,160,255,.035) 0 2px,transparent 2px 9px),
      radial-gradient(60% 50% at 50% 0%,rgba(120,80,255,.28),transparent 70%);}
  .head{position:relative;padding:16px 34px 6px;display:flex;align-items:flex-end;gap:18px}
  .logo{font:italic 900 42px/1 "Arial Black",Impact,sans-serif;letter-spacing:8px;
    background:linear-gradient(180deg,#fff 0%,#9fd0ff 45%,#6c7bff 75%,#c86bff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(120,140,255,.55))}
  .sub{font-size:11px;letter-spacing:5px;color:#7f8cc4;padding-bottom:8px;text-transform:uppercase}
  .body{position:relative;flex:1;display:flex;gap:26px;padding:6px 34px 22px;min-height:0}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:10px;flex:1;min-width:0}
  .card{position:relative;cursor:pointer;overflow:hidden;
    clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);
    background:linear-gradient(160deg,var(--c1) -40%,#0c0f22 60%);
    transition:transform .12s,filter .12s;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px}
  .card canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(4,5,12,.92) 92%);pointer-events:none}
  .card .nm{position:relative;font:italic 900 15px/1 "Arial Black",Impact,sans-serif;letter-spacing:2px;z-index:2;text-shadow:0 2px 0 #000}
  .card .un{position:relative;font-size:8.5px;letter-spacing:1.6px;color:#9aa6dc;z-index:2;text-transform:uppercase;margin-top:3px}
  .card .glow{position:absolute;inset:0;opacity:.35;z-index:0;
    background:radial-gradient(70% 60% at 50% 40%,var(--c) 0%,transparent 70%)}
  .card:hover{transform:translateY(-3px);filter:brightness(1.15)}
  .card.sel{filter:brightness(1.2) drop-shadow(0 0 10px var(--c));transform:translateY(-3px)}
  .card.sel .nm{color:var(--c)}
  .card.sel::before{content:"";position:absolute;inset:0;z-index:3;border:3px solid var(--c);clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);pointer-events:none}

  .panel{width:400px;flex:none;border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(12,16,38,.9),rgba(6,8,20,.94));
    border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 60px -20px #000, inset 0 0 0 1px rgba(255,255,255,.02)}
  #prev{border-radius:12px;align-self:center;width:360px;height:250px}
  .pname{font:italic 900 32px/1 "Arial Black",Impact,sans-serif;letter-spacing:3px;margin-top:4px;color:#fff;text-shadow:0 0 18px var(--c,#6c7bff)}
  .puni{font-size:10px;letter-spacing:3.4px;color:#8f9ad0;text-transform:uppercase;margin:4px 0 10px}
  .stat{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:9.5px;letter-spacing:1.6px;color:#98a3d8}
  .stat b{width:56px;font-weight:600}
  .bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--c),#fff)}
  .moves{margin-top:10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:0;flex:1;padding-right:4px}
  .moves::-webkit-scrollbar{width:5px}.moves::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
  .mv{display:flex;gap:8px;align-items:center;font-size:10.5px;padding:4px 7px;border-radius:7px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06)}
  .mv kbd{font:700 9px/1 ui-monospace,monospace;padding:4px 5px;border-radius:5px;min-width:34px;text-align:center;flex:none;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#dfe6ff}
  .mv span{color:#b9c2ea}
  .mv.sp{background:rgba(120,160,255,.10);border-color:rgba(140,170,255,.28)}
  .mv.ult{background:linear-gradient(90deg,rgba(255,90,60,.26),rgba(255,200,60,.08));border-color:rgba(255,150,70,.45)}
  .mv.ult span{color:#ffd9a8;font-weight:800;letter-spacing:1px}
  .oppline{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:9px;letter-spacing:1.8px;color:#98a3d8}
  .oppline b{font-weight:600;flex:none}
  .oppline span{flex:1;text-align:center;font-weight:800;font-size:11px;letter-spacing:2.4px;color:#e8ecff}
  .oppline button{width:22px;height:22px;border-radius:6px;cursor:pointer;flex:none;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#dfe6ff;font:700 13px/1 inherit}
  .oppline button:hover{background:rgba(255,255,255,.18)}
  .diffrow{display:flex;gap:4px;margin-top:8px}
  .diffrow button{flex:1;padding:7px 2px;border-radius:7px;cursor:pointer;font:800 8.5px/1 inherit;
    letter-spacing:1px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#98a3d8}
  .diffrow button:hover{background:rgba(255,255,255,.14);color:#e8ecff}
  .diffrow button.on{background:linear-gradient(180deg,#ff9a3d,#ff3d5a);border-color:transparent;color:#1a0c12}
  .diffrow button.on:first-child{background:linear-gradient(180deg,#8fa4cc,#5a6a8a);color:#0b0e18}
  .difftag{margin-top:5px;font-size:9px;letter-spacing:.6px;color:#7f8cc4;min-height:22px;line-height:1.35}
  .go{margin-top:auto;padding:13px;border:none;border-radius:11px;cursor:pointer;font:italic 900 17px/1 "Arial Black",Impact,sans-serif;
    letter-spacing:6px;color:#07091a;background:linear-gradient(90deg,#7ce0ff,#8f7bff,#ff7bd2);
    box-shadow:0 10px 30px -8px #6f7bff}
  .go:hover{filter:brightness(1.12)}
  .hint{text-align:center;font-size:9.5px;letter-spacing:2px;color:#6a74a8;margin-top:8px}
  @media(max-width:1080px){.panel{width:330px}#prev{width:290px;height:200px}.logo{font-size:30px;letter-spacing:6px}}
</style>
</head>

<canvas id="game"></canvas>

<div id="select">
  <div class="head">
    <div class="logo">MULTIVERSE</div>
    <div class="sub">Fighters &nbsp;·&nbsp; Arena</div>

      <div class="oppline"><b>OPPONENT</b><button id="oppPrev">&lsaquo;</button><span id="oppName">RANDOM</span><button id="oppNext">&rsaquo;</button></div>

      <div class="difftag" id="difftag"></div>

      <div class="hint">A·D move  SPACE jump  W·S aim  SHIFT dash  I super dash  J·K·L attack  U ultimate  TAB moves</div>
    </div>
  </div>
</div>

   MULTIVERSE — single-file fighter
   ======================================================================= */

/* ---------------- math + color utils ---------------- */
const TAU=Math.PI*2, rnd=(a=1,b=0)=>b+Math.random()*(a-b), rint=n=>0|(Math.random()*n);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eOut  =t=>1-Math.pow(1-t,3);
const eSnap =t=>1-Math.pow(1-t,5);
const eIn   =t=>t*t*t;
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack =t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const seg01=(t,a,b)=>clamp((t-a)/(b-a),0,1);            // remap t in [a,b] -> 0..1
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
function hx(h){
  if(h[0]!=='#'){const m=h.match(/\d+(\.\d+)?/g);return[+m[0],+m[1],+m[2]];}
  h=h.slice(1);if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
const h2=v=>{v=clamp(Math.round(v),0,255);return(v<16?'0':'')+v.toString(16);};
function mixC(a,b,k){const A=hx(a),B=hx(b);return'#'+h2(A[0]+(B[0]-A[0])*k)+h2(A[1]+(B[1]-A[1])*k)+h2(A[2]+(B[2]-A[2])*k);}
function shade(c,k){const[r,g,b]=hx(c);const f=v=>clamp(Math.round(k<0?v*(1+k):v+(255-v)*k),0,255);
  return'#'+h2(f(r))+h2(f(g))+h2(f(b));}
const _rgbaC=new Map();
function rgba(c,a){let v=_rgbaC.get(c);if(!v){v=hx(c);_rgbaC.set(c,v);}
  return`rgba(${v[0]},${v[1]},${v[2]},${a})`;}

/* A material = base / shadow / light / ink. Shadows lean toward indigo (skin toward
   warm rose) instead of plain black, which is what gives cel shading its colour. */
const _mat=new Map();
function MAT(base,kind){
  const key=base+'|'+(kind||'');let m=_mat.get(key);if(m)return m;
  const sh=kind==='skin'?mixC(base,'#9c3f5c',.34):kind==='metal'?mixC(base,'#1a2140',.55):
           kind==='glow'?base:mixC(base,'#22124a',.44);
  m={b:base,s:sh,l:mixC(base,'#ffffff',kind==='metal'?.55:.3),i:mixC(base,'#0a0612',kind==='glow'?.4:.84),k:kind||''};
  _mat.set(key,m);return m;
}
/* global tint — silhouettes (impact frames, afterimages) and hit flashes route every
   colour through tc(), so the renderer never needs an offscreen buffer to recolour */
let TINT=null;
const _tint=new Map();
function tc(col){
  if(!TINT)return col;
  const key=col+'|'+TINT.c+'|'+TINT.k;let v=_tint.get(key);
  if(!v){v=mixC(col,TINT.c,TINT.k);if(_tint.size>6000)_tint.clear();_tint.set(key,v);}
  return v;
}
function withTint(c,k,fn){const o=TINT;TINT={c,k:Math.round(k*20)/20};try{fn();}finally{TINT=o;}}

/* ---------------- game-time scheduler (pauses with hitstop, cutscenes and menus) ---------------- */
const timers=[];
function later(s,fn){timers.push({t:s,fn});}
function tickTimers(dt){
  for(let i=timers.length-1;i>=0;i--){const q=timers[i];q.t-=dt;
    if(q.t<=0){timers.splice(i,1);q.fn();}}
}

/* ---------------- skeleton geometry (S units, feet at 0, up is negative) ---------------- */
const G={HIP:62,THIGH:30,SHIN:30,ANK:4,WAIST:12,CHEST:24,NECK:5,HEADC:10.5,HR:9.6,UARM:22,FARM:20};

/* ---------------- poses ----------------
   angles: 0 = straight down, + = forward (facing dir)
   aB/aF = [shoulder, elbow]  lB/lF = [hip, knee]
   extras (all optional): cb chest bend · wa weapon angle · rot whole-body roll about the hip
   hF/hB hand shape (0 fist, 1 open, 2 blade-hand, 3 grip) · ex expression · pt toe point  */
// NOTE ON KNEES: shin direction = hip + knee. A real knee flexes BACKWARD, so the
// knee term is always <= 0.
function P(o){return Object.assign({ty:0,lean:0,head:0,cb:0,wa:0,rot:0,pt:0,
  aB:[.35,.3],aF:[-.3,.35],lB:[.20,-.22],lF:[-.20,-.12]},o);}

/* two-bone IK in the pose convention: hip joint at (hx,hy), ankle target (tx,ty) ->
   [thighAngle, kneeAngle] with the knee pointing forward */
function ik2(hx,hy,tx,ty,a,b){
  const dx=tx-hx,dy=ty-hy,d=clamp(Math.hypot(dx,dy),Math.abs(a-b)+.01,(a+b)*.9995);
  const phi=Math.atan2(dx,dy);
  const al=Math.acos(clamp((a*a+d*d-b*b)/(2*a*d),-1,1));
  const th=phi+al;
  const kx=hx+Math.sin(th)*a,ky=hy+Math.cos(th)*a;
  const sh=Math.atan2(tx-kx,ty-ky);
  return[th,sh-th];
}
/* author grounded poses by where the feet stand: fx=[frontX,backX], ty = crouch depth */
function SP(o){
  const p=P(o);
  if(o.fx){const hy=-G.HIP+p.ty, ay=-G.ANK;
    p.lF=ik2(3.5,hy,o.fx[0],ay,G.THIGH,G.SHIN);
    p.lB=ik2(-3.5,hy,o.fx[1],ay,G.THIGH,G.SHIN);}
  return p;
}

const _PK=['ty','lean','head','cb','wa','rot','pt'];
function mixPose(a,b,t){
  const o={};
  for(const k of _PK)o[k]=lerp(a[k]||0,b[k]||0,t);
  for(const k of['aB','aF','lB','lF'])o[k]=[lerp(a[k][0],b[k][0],t),lerp(a[k][1],b[k][1],t)];
  const d=t<.5?a:b;
  o.hF=d.hF;o.hB=d.hB;o.ex=d.ex;
  return o;
}
function copyPose(p){const o=Object.assign({},p);for(const k of['aB','aF','lB','lF'])o[k]=[p[k][0],p[k][1]];return o;}
/* keyframe helper: kf(q,[[0,poseA],[.4,poseB],[1,poseC]],easing) */
function kf(q,keys,ef){
  ef=ef||eInOut;
  const pz=v=>typeof v==='string'?(POSE[v]||STANCE[v]):v;
  if(q<=keys[0][0])return pz(keys[0][1]);
  for(let i=1;i<keys.length;i++){
    if(q<=keys[i][0]){const a=keys[i-1],b=keys[i];
      return mixPose(pz(a[1]),pz(b[1]),ef((q-a[0])/(b[0]-a[0])));}
  }
  return pz(keys[keys.length-1][1]);
}

/* ---------------- canvas / camera ---------------- */
const CV=document.getElementById('game'), X=CV.getContext('2d');
let W=0,H=0,GY=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;GY=Math.round(H*.84);
  CV.width=W*DPR|0;CV.height=H*DPR|0;CV.style.width=W+'px';CV.style.height=H+'px';
  bloomResize();
}
function onResize(){
  resize();
  if(!W||!H||!pl.ch)return;                 // keep the fight valid across viewport changes
  for(const f of[pl,dum]){f.x=clamp(f.x,60,W-60);if(f.onG||f.y>GY)f.y=GY;}
  dum.home=clamp(dum.home||W*.68,90,W-90);
  if(Math.abs(pl.x-dum.x)<80){pl.x=W*.32;dum.x=dum.home=W*.68;}   // un-stack them
  camReset();
}
/* cam.zoom is the CINEMATIC multiplier; cam.z is the dynamic action zoom driven by
   how far apart the fighters are; kick is a short punch-in on heavy hits. */
const cam={sh:0,zoom:1,z:1,zz:1,cx:0,cy:0,kick:0,flash:0,flashC:'#fff',dark:0,letter:0,slow:1,rot:0,rotT:0,focus:null};
function updCamera(rdt){
  let fx,fy,tz;
  if(koT>0&&koWho){fx=koWho.x;fy=koWho.y-72;tz=1.9;}
  else if(cam.focus){fx=cam.focus.x;fy=cam.focus.y-70;tz=cam.focus.z||1.8;}
  else{
    const sep=Math.abs(pl.x-dum.x), top=Math.min(pl.y,dum.y)-128, bot=GY+10;
    fx=(pl.x+dum.x)/2;
    fy=(top+bot)/2-6;
    tz=clamp(Math.min(W/(sep+360),H/((bot-top)+220)),1.05,2.1);
  }
  cam.z=lerp(cam.z,tz,Math.min(1,rdt*3.4));
  cam.kick=Math.max(0,cam.kick-rdt*3.6);
  cam.rot=lerp(cam.rot,cam.rotT,Math.min(1,rdt*6));cam.rotT*=Math.pow(.02,rdt);
  const z=cam.zz=cam.z*cam.zoom*(1+cam.kick);
  const hw=(W/2)/z, hh=(H/2)/z, top=-150, bot=H;
  cam.cx=lerp(cam.cx,clamp(fx,hw,Math.max(hw,W-hw)),Math.min(1,rdt*6.5));
  cam.cy=lerp(cam.cy,(top+hh>bot-hh)?(top+bot)/2:clamp(fy,top+hh,bot-hh),Math.min(1,rdt*5.5));
}
function camReset(){cam.z=cam.zz=1;cam.zoom=1;cam.kick=0;cam.cx=W/2;cam.cy=H/2;cam.rot=cam.rotT=0;cam.focus=null;}

/* ---------------- post: cheap bloom ----------------
   Downsample the frame, square it twice with 'multiply' (a soft threshold — darks
   vanish, highlights survive), then add it back blurred by the upscale.            */
const BL={c:document.createElement('canvas'),c2:document.createElement('canvas'),on:true,filt:false};
BL.x=BL.c.getContext('2d');BL.x2=BL.c2.getContext('2d');
BL.filt=typeof BL.x.filter==='string';
function bloomResize(){
  BL.w=Math.max(2,(W/4)|0);BL.h=Math.max(2,(H/4)|0);
  BL.c.width=BL.w;BL.c.height=BL.h;BL.c2.width=Math.max(1,BL.w>>1);BL.c2.height=Math.max(1,BL.h>>1);
}
function bloom(k){
  if(!BL.on||k<=0)return;
  const b=BL.x;
  b.globalCompositeOperation='copy';b.globalAlpha=1;b.imageSmoothingQuality='high';
  b.drawImage(CV,0,0,BL.w,BL.h);
  b.globalCompositeOperation='multiply';b.drawImage(BL.c,0,0);b.drawImage(BL.c,0,0);
  const b2=BL.x2;b2.globalCompositeOperation='copy';
  if(BL.filt)b2.filter='blur(2px)';
  b2.drawImage(BL.c,0,0,BL.c2.width,BL.c2.height);
  if(BL.filt)b2.filter='none';
  X.save();X.setTransform(1,0,0,1,0,0);X.globalCompositeOperation='lighter';X.imageSmoothingEnabled=true;
  X.globalAlpha=k*.55;X.drawImage(BL.c,0,0,CV.width,CV.height);
  X.globalAlpha=k*.9;X.drawImage(BL.c2,0,0,CV.width,CV.height);
  X.restore();
}
/* impact frame: invert + desaturate the finished frame for a beat (anime hit frames) */
function impactFrameFX(kind){
  X.save();X.setTransform(1,0,0,1,0,0);
  X.globalCompositeOperation='saturation';X.fillStyle='#808080';X.fillRect(0,0,CV.width,CV.height);
  if(kind!==2){X.globalCompositeOperation='difference';X.fillStyle='#ffffff';X.fillRect(0,0,CV.width,CV.height);}
  X.globalCompositeOperation='multiply';X.fillStyle=kind===2?'#c8c8c8':'#e6e6e6';X.fillRect(0,0,CV.width,CV.height);
  X.globalCompositeOperation='color-burn';X.fillStyle='#b0b0b0';X.fillRect(0,0,CV.width,CV.height);
  X.restore();
}
/* screen-space radial speed lines (dashes, supers, cut-ins) */
function speedLines(cx,cy,col,a,inner,seed,n){
  n=n||70;X.save();X.globalAlpha=a;X.fillStyle=col;
  const R2=Math.hypot(W,H);
  for(let i=0;i<n;i++){const an=(i/n)*TAU+hash(i+seed)*.08,w=.004+hash(i*3+seed)*.012,r0=inner*(.8+hash(i*7+seed)*.5);
    X.beginPath();X.moveTo(cx+Math.cos(an-w)*R2,cy+Math.sin(an-w)*R2);X.lineTo(cx+Math.cos(an)*r0,cy+Math.sin(an)*r0);
    X.lineTo(cx+Math.cos(an+w)*R2,cy+Math.sin(an+w)*R2);X.fill();}
  X.restore();
}
function vignette(a){
  const vg=X.createRadialGradient(W/2,H/2,Math.min(W,H)*.32,W/2,H/2,Math.max(W,H)*.78);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,'+a+')');

/* ---------------- anime hit spark ----------------

   direction, a squashed shock ring — then element particles on top.          */
function hitSpark(x,y,dir,col,pw,big){
  const s=big?1.55:1,ro=rnd(TAU),n=big?12:9;
  const spikes=[];for(let i=0;i<n;i++)spikes.push(.55+hash(ro*10+i)*.7);
  effs.push({t:0,l:big?.2:.13,top:1,d(c,p){
    c.save();c.translate(x,y);c.rotate(ro);
    const R=lerp(16,58,eOut(p))*s,a=1-p;
    for(const[k,col2,al]of[[1.25,col,.9],[.8,'#ffffff',1]]){
      c.globalAlpha=a*al;c.fillStyle=col2;c.beginPath();
      for(let i=0;i<n*2;i++){const an=i*Math.PI/n,rr=i%2?R*.18*k:R*spikes[i>>1]*k;c.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);}
      c.closePath();c.fill();}

  const m=big?9:6;
  for(let i=0;i<m;i++){const an=(dir>0?0:Math.PI)+rnd(1.1,-1.1)*(i%3?1:2.4),L=rnd(110,50)*s,w=rnd(4,2)*s,d0=rnd(10,0);
    effs.push({t:0,l:rnd(.18,.1),top:1,d(c,p){const q=eOut(p);c.globalAlpha=1-p;c.fillStyle=i%2?col:'#ffffff';
      const cx=Math.cos(an),cy=Math.sin(an),r0=d0+q*L*.5,r1=d0+q*L+18*s;
      c.beginPath();c.moveTo(x+cx*r0-cy*w,y+cy*r0+cx*w);c.lineTo(x+cx*r1,y+cy*r1);c.lineTo(x+cx*r0+cy*w,y+cy*r0-cx*w);c.fill();}});}
  effs.push({t:0,l:big?.3:.2,d(c,p){c.globalAlpha=(1-p)*.9;c.strokeStyle='#ffffff';c.lineWidth=(big?7:4)*(1-p);
    c.beginPath();c.ellipse(x,y,lerp(8,big?95:60,eOut(p)),lerp(8,big?95:60,eOut(p))*.55,dir*.4,0,TAU);c.stroke();}});
  const gs=glowSprite(col);

}

function crack(x,power,col){
  const arms=[];const n=5+rint(3);
  for(let i=0;i<n;i++){const a=(i/n)*Math.PI+rnd(.25,-.25),pts=[[x,GY]];let px=x,py=GY,an=a;
    for(let j=0;j<4;j++){an+=rnd(.5,-.5);const L=rnd(30,14)*power;px+=Math.cos(an)*L*1.6;py+=Math.abs(Math.sin(an))*L*.28;pts.push([px,py]);}
    arms.push(pts);}
  decals.push({t:0,l:1.6,d(c,p){c.globalAlpha=(p<.7?1:(1-p)/.3)*.85;c.lineJoin='round';
    c.strokeStyle='#07060c';c.lineWidth=3.2*power;for(const a of arms){c.beginPath();a.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke();}
    c.globalAlpha*=Math.max(0,1-p*2.2);c.strokeStyle=col||'#ffd9a0';c.lineWidth=1.2*power;
    for(const a of arms){c.beginPath();a.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke();}}});
}

/* ---------------- particle drawing ---------------- */
function drawParts(){
  X.save();
  for(const p of parts){if(p.t!=='smoke'&&p.t!=='ink'&&p.t!=='petal'&&p.t!=='snow'&&p.t!=='leaf')continue;
    const a=clamp(p.l/p.m,0,1);
    if(p.t==='smoke'){X.globalAlpha=a*.55;const r=p.s*(2.2-a);X.drawImage(SMOKE,p.x-r,p.y-r,r*2,r*2);}
    else if(p.t==='ink'){X.globalAlpha=a*.75;const r=p.s*(1.7-a*.5);X.drawImage(INK,p.x-r,p.y-r,r*2,r*2);}
    else if(p.t==='snow'){X.globalAlpha=a*.9;X.fillStyle='#f4f8ff';X.beginPath();X.arc(p.x,p.y,p.s,0,TAU);X.fill();}
    else{X.globalAlpha=a*.95;X.save();X.translate(p.x,p.y);X.rotate(p.r);X.fillStyle=p.c;X.beginPath();
      if(p.t==='petal'){X.ellipse(0,0,p.s*1.4,p.s*.7,0,0,TAU);X.fill();X.fillStyle=rgba('#ffffff',.4);X.beginPath();X.ellipse(-p.s*.3,0,p.s*.6,p.s*.3,0,0,TAU);}
      else{X.ellipse(0,0,p.s*1.7,p.s*.6,0,0,TAU);}
      X.fill();X.restore();}
  }
  X.globalAlpha=1;X.globalCompositeOperation='lighter';
  for(const p of parts){
    if(p.t==='smoke'||p.t==='ink'||p.t==='petal'||p.t==='snow'||p.t==='leaf')continue;
    const a=clamp(p.l/p.m,0,1);X.globalAlpha=a;
    switch(p.t){
    case 'spark':case 'streak':
      X.strokeStyle=p.c;X.lineWidth=Math.max(1,p.s*a);X.lineCap='round';
      X.beginPath();X.moveTo(p.x,p.y);X.lineTo(p.x-p.vx*(p.t==='streak'?.06:.024),p.y-p.vy*(p.t==='streak'?.06:.024));X.stroke();
      if(p.s>3.5){X.strokeStyle='#fff';X.lineWidth=Math.max(.8,p.s*a*.35);X.stroke();}break;
    case 'shard':{
      const ang=Math.atan2(p.vy,p.vx);
      X.save();X.translate(p.x,p.y);X.rotate(ang);X.fillStyle=p.c;
      X.beginPath();X.moveTo(p.s*1.9,0);X.lineTo(-p.s,p.s*.62);X.lineTo(-p.s,-p.s*.62);X.closePath();X.fill();X.restore();break;}
    case 'sq':{
      X.save();X.translate(p.x,p.y);X.rotate(p.r);X.fillStyle=p.c;X.fillRect(-p.s,-p.s,p.s*2,p.s*2);X.restore();break;}
    case 'star':{
      X.save();X.translate(p.x,p.y);X.rotate(p.r);X.fillStyle=p.c;
      X.beginPath();for(let i=0;i<8;i++){const ang=i*TAU/8;const r=i%2?p.s*.36:p.s*2.1;
        X.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);}X.closePath();X.fill();X.restore();break;}
    case 'ember':{const r=p.s*(1.4+Math.sin(p.r*6+p.l*30)*.4);X.drawImage(glowSprite(p.c,1),p.x-r,p.y-r,r*2,r*2);break;}
    default:{const r=p.s*2.2;X.drawImage(glowSprite(p.c),p.x-r,p.y-r,r*2,r*2);}
    }
  }
  X.restore();
}
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;
    if(p.l<=0){parts.splice(i,1);continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.35,dt);p.r+=p.vr*dt;}
  for(let i=effs.length-1;i>=0;i--){effs[i].t+=dt;if(effs[i].t>=effs[i].l)effs.splice(i,1);}
  for(let i=decals.length-1;i>=0;i--){decals[i].t+=dt;if(decals[i].t>=decals[i].l)decals.splice(i,1);}
}
function drawEffs(top){
  X.save();X.globalCompositeOperation='lighter';
  for(const e of effs){if(!!e.top!==top)continue;X.save();X.globalAlpha=1;e.d(X,clamp(e.t/e.l,0,1));X.restore();}
  X.restore();
}
function drawDecals(){for(const d of decals){X.save();d.d(X,clamp(d.t/d.l,0,1));X.restore();}}

const ATK_IDX={l1:0,l2:1,l3:2,h:3};
const ATK_T=[[.070,.055,.10],[.085,.055,.13],[.105,.075,.20],[.200,.10,.30]];
const ATK_K=[[2.2,0],[3,0],[7,-3.4],[12,-7.5]];
// directional slots: dl, dh, ul, uh, aj, ak   (ak has POSITIVE ky — it spikes down)
const TLT_IDX={dl:0,dh:1,ul:2,uh:3,aj:4,ak:5};
const TLT_T=[[.075,.060,.14],[.160,.090,.28],[.075,.060,.14],[.200,.100,.30],[.090,.100,.16],[.130,.160,.22]];
const TLT_K=[[3,0],[9,-2],[4,-5.5],[11,-9.5],[4,-1],[6,7]];
const HEAVYSLOT={dh:1,uh:1,ak:1,h:1};
function atkDef(f,kind){
  const C=f.ch,m=MOVES[C.id],pick=(v,d)=>v===undefined?d:v;
  let e,t,k,fast;
  if(kind in ATK_IDX){const i=ATK_IDX[kind];e=m.a[i];t=ATK_T[i];k=ATK_K[i];fast=i<3;}
  else{const i=TLT_IDX[kind];if(i===undefined)return null;
       e=TILT[C.id][i];t=TLT_T[i];k=TLT_K[i];fast=!HEAVYSLOT[kind];}
  const o=e[6]||{}, mult=(f.buffT>0?1.4:1)*(f.brain?f.brain.dmg:1);
  return{kind,pose:e[0],dmg:e[1]*C.pow*mult,reach:e[2],ry:e[3],sfx:e[4],name:e[5],el:m.el,
    d:pick(o.d,t[0])/(fast?C.spd:1),a:pick(o.a,t[1]),r:pick(o.r,t[2]),
    kb:pick(o.kb,k[0]),ky:pick(o.ky,k[1]),col:HEAVYSLOT[kind]?C.c1:C.c3};
}
// Smash-style resolution: direction held + button -> which move comes out
function resolveAtk(f,btn,inp){
  const air=!f.onG, dn=inp.d, up=inp.u;
  if(air) return (btn==='k'||dn)?'ak':'aj';
  if(dn)  return btn==='j'?'dl':'dh';
  if(up)  return btn==='j'?'ul':'uh';
  return btn==='j'?(f.chain===1?'l2':f.chain===2?'l3':'l1'):'h';
}

function dealDmg(d,col,big,tgt,src){
  tgt=tgt||dum;src=src||pl;
  const blocked=tgt.guard>0&&Math.sign(src.x-tgt.x)===tgt.face;
  d=Math.round(d*(blocked?.16:1)*(tgt.brain?tgt.brain.taken:1));
  if(tgt.hpMax<9999)tgt.hp=Math.max(0,tgt.hp-d);
  if(src===pl){                                  // training readouts track your damage
    tgt.tot+=d;tgt.combo++;if(tgt.combo===1)tgt.cdmg=0;tgt.cdmg=(tgt.cdmg||0)+d;tgt.comboT=1.35;tgt.best=Math.max(tgt.best,tgt.combo);dps.acc+=d;}
  else if(tgt===pl){pl.combo++;pl.comboT=1.35;}
  if(!cine)num(tgt.x+rnd(20,-20),tgt.y-rnd(150,70),d,blocked?'#9aa4c8':(col||'#fff'),big);
  if(blocked){tgt.guardFX=.18;burst(tgt.x+tgt.face*22,tgt.y-70,8,'#bcd0ff',240,4,'spark',0);}
  src.meter=Math.min(100,src.meter+(src.st==='ult'||cine?0:d*.55));
  tgt.meter=Math.min(100,tgt.meter+d*.30);       // taking hits builds meter too
  tgt.wobV+=src.face*(big?9:3.4);
  if(tgt.hpMax<9999&&tgt.hp<=0&&!koT&&!cine)ko(tgt,src);
  return d;
}

function applyHit(own,tgt,h){

      if(!s.pierce){shots.splice(i,1);continue;}

  if(inp.d&&!f.onG&&f.vy>-260&&f.st!=='ffall'&&!dashing){f.vy=1100;f.st='ffall';

function tryAttack(f,inp){

/* ---- the brain: pick an action, hold it for one reaction window ---- */
const AIN=blankInput();
function aiInput(f,dt){
  const b=f.brain,fo=f.foe;

  if(!b||koT>0||ult||cine||fo.st==='down'&&Math.random()<.9)return AIN;                  // stands down during your ultimate
  const d=fo.x-f.x, ad=Math.abs(d), dir=Math.sign(d)||1, dy=fo.y-f.y;

  const a=f.aiAct;
  if(a.move==='in'&&ad>(a.range||70))AIN[dir>0?'r':'l']=1;
  else if(a.move==='out')AIN[dir>0?'l':'r']=1;
  else if(f.st==='idle'||f.st==='block')f.face=dir;   // hold/guard: keep facing
  if(a.block)AIN.d=1;

    if(a.press==='j')AIN.pJ=1;else if(a.press==='k')AIN.pK=1;
    else if(a.press==='l'){AIN.pL=1;AIN.slot=a.slot||'n';}

function aiChoose(f,b,ad,dy){
  const a={move:'hold',press:null,slot:'n',fired:0,range:70};
  const foe=f.foe;
  if(f.meter>=100&&b.sp>=.34&&ad<ULT_REACH(f)&&foe.st!=='down'&&Math.random()<.5){a.press='ult';return a;}  // cash in a full meter
  if(ad>300&&b.dash>=.38&&Math.random()<b.dash*.35){a.press='sd';return a;}                            // super dash in
  if(f.hp<f.hpMax*.28&&Math.random()<b.block*.8){a.block=1;a.move='out';return a;} // turtle when hurt
  if(dy<-80&&ad<170&&Math.random()<b.aggr){a.press='k';a.up=1;return a;}           // anti-air
  if(foe.st==='atk'&&ad<150&&Math.random()<b.block){a.block=1;return a;}           // react to a swing
  if(!f.onG){                                                                      // airborne: aerials
    if(ad<130&&Math.random()<b.aggr){a.press=Math.random()<.4?'k':'j';return a;}
    a.move='in';a.range=60;return a;}
  if(ad>360){
    if(Math.random()<b.sp){a.press='l';a.slot='n';return a;}                       // zone with a projectile
    if(Math.random()<b.dash){a.press='dash';a.move='in';a.range=90;return a;}
    a.move='in';a.range=90;return a;}
  if(ad>150){
    if(Math.random()<b.dash*.75){a.press='dash';a.move='in';a.range=70;return a;}  // dash attack range
    if(Math.random()<b.sp*.6){a.press='l';a.slot=Math.random()<.5?'d':'n';return a;}
    a.move='in';a.range=70;return a;}
  const r=Math.random();
  if(r<.09)                {a.move='out';return a;}
  if(r<.17&&b.block>0)     {a.block=1;return a;}
  if(r<.29)                {a.press='k';a.move='in';a.range=80;return a;}
  if(r<.38&&b.sp>0)        {a.press='l';a.slot='d';return a;}
  if(r<.46)                {a.press='j';a.down=1;return a;}
  if(r<.53&&b.sp>0)        {a.press='l';a.slot='u';return a;}
  if(r<.60&&b.aggr>.6)     {a.press='jump';a.move='in';a.range=60;return a;}
  a.press='j';a.move='in';a.range=70;return a;
}

/* =======================================================================
   FIGHTER RENDERING
   A real skeleton (FK + IK foot planting), tapered limbs with hands and boots,
   anime cel shading (shadow = the part minus itself nudged toward the light),
   coloured ink outlines, costume layers per fighter, detailed faces that hold
   up in cutscene close-ups, and verlet cloth for capes / scarves / long hair.
   Coordinates: feet at (0,0), facing +x, up is -y.
   ======================================================================= */
const LX=.42, LY=-.91;                 // light comes from the front and above
let RL=0;                              // lite mode (ghosts, reflections): flat, no ink
let OLW=1.5;                           // ink width for the current draw
let RS=null;                           // render state for the current draw

function part(c,path,m,sh){
  c.beginPath();path(c);
  if(RL){c.fillStyle=tc(m.b);c.fill();return;}
  c.lineWidth=OLW;c.strokeStyle=tc(m.i);c.stroke();
  if(!sh||m.k==='glow'||RS&&RS.flat){c.fillStyle=tc(m.b);c.fill();return;}
  c.fillStyle=tc(m.s);c.fill();
  c.save();c.clip();c.translate(LX*sh,LY*sh);c.beginPath();path(c);c.fillStyle=tc(m.b);c.fill();c.restore();
}
/* same, but the light can be pushed in any direction (used for curved volumes) */
function partD(c,path,m,dx,dy){
  c.beginPath();path(c);
  if(RL){c.fillStyle=tc(m.b);c.fill();return;}
  c.lineWidth=OLW;c.strokeStyle=tc(m.i);c.stroke();
  c.fillStyle=tc(m.s);c.fill();
  c.save();c.clip();c.translate(dx,dy);c.beginPath();path(c);c.fillStyle=tc(m.b);c.fill();c.restore();
}
/* two-pass drawing: ink every piece of a limb first, then fill them, so joints
   merge into one silhouette instead of showing ring outlines at knees/elbows */
function inkP(c,path,m){if(RL)return;c.beginPath();path(c);c.lineWidth=OLW;c.strokeStyle=tc(m.i);c.stroke();}
function fillP(c,path,m,sh){
  c.beginPath();path(c);
  if(RL||!sh||m.k==='glow'||RS&&RS.flat){c.fillStyle=tc(m.b);c.fill();return;}
  c.fillStyle=tc(m.s);c.fill();
  c.save();c.clip();c.translate(LX*sh,LY*sh);c.beginPath();path(c);c.fillStyle=tc(m.b);c.fill();c.restore();
}
/* flat-ended band across a limb (wraps, cuffs, sleeve hems), clipped to the limb */
function bandPath(c,A,B,w){
  const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1e-3,nx=-dy/L*w,ny=dx/L*w;
  c.moveTo(A[0]+nx,A[1]+ny);c.lineTo(B[0]+nx,B[1]+ny);c.lineTo(B[0]-nx,B[1]-ny);c.lineTo(A[0]-nx,A[1]-ny);c.closePath();
}
function band(c,limbPath,A,B,w,m){
  clipDo(c,limbPath,()=>{fillP(c,cc=>bandPath(cc,A,B,w),m,0);
    if(!RL){const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1,nx=-dy/L*w,ny=dx/L*w;
      inkLine(c,[[A[0]+nx,A[1]+ny],[A[0]-nx,A[1]-ny]],OLW*.55,m.i);inkLine(c,[[B[0]+nx,B[1]+ny],[B[0]-nx,B[1]-ny]],OLW*.55,m.i);}});
}
function fillOnly(c,path,col){c.beginPath();path(c);c.fillStyle=tc(col);c.fill();}
function inkLine(c,pts,w,col){
  if(RL)return;c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);
  c.lineWidth=w;c.strokeStyle=tc(col);c.lineCap='round';c.lineJoin='round';c.stroke();
}
/* tapered segment A->B with a bulge at mt, round caps */
function segPath(c,A,B,w0,wm,w1,mt){
  mt=mt===undefined?.38:mt;
  const ax=A[0],ay=A[1],bx=B[0],by=B[1],dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy)||1e-3;
  const nx=-dy/L,ny=dx/L,an=Math.atan2(ny,nx);
  const mx=ax+dx*mt,my=ay+dy*mt;
  // quadratic control so the side passes through the bulge point at the midpoint
  const c1x=2*(mx+nx*wm)-(ax+nx*w0+bx+nx*w1)/2, c1y=2*(my+ny*wm)-(ay+ny*w0+by+ny*w1)/2;
  const c2x=2*(mx-nx*wm)-(ax-nx*w0+bx-nx*w1)/2, c2y=2*(my-ny*wm)-(ay-ny*w0+by-ny*w1)/2;
  c.moveTo(ax+nx*w0,ay+ny*w0);
  c.quadraticCurveTo(c1x,c1y,bx+nx*w1,by+ny*w1);
  c.arc(bx,by,w1,an,an-Math.PI,true);
  c.quadraticCurveTo(c2x,c2y,ax-nx*w0,ay-ny*w0);
  c.arc(ax,ay,w0,an+Math.PI,an,true);

function smoothTo(c,pts,move){
  const n=pts.length;
  if(move)c.moveTo(pts[0][0],pts[0][1]);else c.lineTo(pts[0][0],pts[0][1]);
  for(let i=1;i<n-1;i++)c.quadraticCurveTo(pts[i][0],pts[i][1],(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2);
  c.lineTo(pts[n-1][0],pts[n-1][1]);
}
/* ribbon along a polyline with per-point half widths (capes, scarves, hair) */
function tubePath(c,P,Wd,round){
  const n=P.length,A=[],B=[];
  for(let i=0;i<n;i++){
    const a=P[Math.max(0,i-1)],b=P[Math.min(n-1,i+1)];
    let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const w=Wd[i];A.push([P[i][0]-dy*w,P[i][1]+dx*w]);B.push([P[i][0]+dy*w,P[i][1]-dx*w]);
  }
  smoothTo(c,A,true);
  if(round){const e=P[n-1];c.arc(e[0],e[1],Math.max(.01,Wd[n-1]),Math.atan2(A[n-1][1]-e[1],A[n-1][0]-e[0]),Math.atan2(B[n-1][1]-e[1],B[n-1][0]-e[0]),true);}

const rot=(x,y,a)=>[x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)];
const add=(p,v,k)=>[p[0]+v[0]*(k===undefined?1:k),p[1]+v[1]*(k===undefined?1:k)];

const lerpP=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];

/* ---------------- materials per fighter ---------------- */

const _far=new Map();
function farM(m){let v=_far.get(m);if(!v){v=MAT(mixC(m.b,'#161030',.3),m.k);_far.set(m,v);}return v;}

/* ---------------- skeleton ---------------- */
function skel(ch,po,S,opt){
  const g=ch.w,K={S,g};
  const sn=Math.sin,cs=Math.cos,le=po.lean,lt=le+(po.cb||0);
  const hy=(-G.HIP+po.ty)*S;
  K.hip=[0,hy];K.le=le;K.lt=lt;
  K.waist=[sn(le)*G.WAIST*S,hy-cs(le)*G.WAIST*S];
  K.fw=[cs(lt),sn(lt)];K.up=[sn(lt),-cs(lt)];
  K.sh=add(K.waist,K.up,G.CHEST*S);
  K.neck=add(K.sh,K.up,3*S);
  K.ha=lt+(po.head||0);
  K.head=add(K.neck,[sn(K.ha),-cs(K.ha)],G.HEADC*S);
  const shF=add(add(K.sh,K.fw,1.5*S*g),K.up,-.5*S), shB=add(add(K.sh,K.fw,-2.8*S*g),K.up,-.2*S);
  const arm=(sp,a)=>{const A1=a[0]-lt,e=add(sp,dirA(A1),G.UARM*S),A2=A1+a[1],h=add(e,dirA(A2),G.FARM*S);return{s:sp,e,h,A1,A2};};
  K.aF=arm(shF,po.aF);K.aB=arm(shB,po.aB);
  const hjF=add([3.4*S*g,hy+1*S],[sn(le*.3),0],0), hjB=[-3.6*S*g,hy];
  const leg=(hj,l)=>{
    const k=add(hj,dirA(l[0]),G.THIGH*S),A2=l[0]+l[1],an=add(k,dirA(A2),G.SHIN*S);
    return{h:hj,k,a:an,A1:l[0],A2,plant:0};
  };
  K.lF=leg(hjF,po.lF);K.lB=leg(hjB,po.lB);
  if(opt&&opt.plant&&Math.abs(po.rot||0)<.2){       // foot planting: snap near-ground feet to the floor
    for(const L of[K.lF,K.lB]){
      const gy=-G.ANK*S;

/* where the front hand (+ weapon tip) is — used by trails, cutscenes and projectiles */

  } else if(shape===2){                                 // blade-hand: fingers together, flat

/* ---------------- torso ---------------- */
function TP(x,y){                                        // torso-space -> body space
  const {S,K}=RS,g=K.g;
  if(y>=-G.WAIST){const r=rot(x*S*g,y*S,K.le);return[K.hip[0]+r[0],K.hip[1]+r[1]+G.WAIST*S*0+0];}
  const r=rot(x*S*g,(y+G.WAIST)*S,K.lt);return[K.waist[0]+r[0],K.waist[1]+r[1]];
}
// y in torso space is measured from the hip joint (0) up to the neck (-40)
function TPh(x,y){const {S,K}=RS,g=K.g,r=rot(x*S*g,y*S,K.le);return[K.hip[0]+r[0],K.hip[1]+r[1]];}
function torsoOutline(){
  const f=RS.lk.fem,hv=RS.lk.build==='heavy'||RS.lk.build==='strong';
  const sw=hv?1.06:f?.92:1;
  const B=f?[[-8.4,-11],[-8.2,-17],[-10*sw,-25],[-10.6*sw,-31],[-9.6*sw,-36.2],[-5*sw,-39.2],[-2.2,-40.2]]
           :[[-9.2,-11],[-9.7,-17],[-11.4*sw,-25],[-12.2*sw,-31],[-10.8*sw,-36.4],[-5.6*sw,-39.4],[-2.6,-40.4]];
  const F=f?[[2.6,-40],[6*sw,-38.6],[9.6*sw,-35.2],[12.6,-30.2],[13.2,-26.6],[10.8,-23],[8.2,-19.6],[7.6,-15],[8.2,-11]]
           :[[2.8,-40],[6.6*sw,-38.6],[10.8*sw,-35.2],[12.6*sw,-29.6],[12*sw,-24],[9.6,-19],[8.8,-14.4],[8.6,-11]];
  return{B,F};
}
function torsoPath(c){
  const {B,F}=torsoOutline();
  smoothTo(c,B.map(p=>TP(p[0],p[1])),true);
  smoothTo(c,F.map(p=>TP(p[0],p[1])),false);

}
function pelvisPath(c){

function clipDo(c,path,fn){c.save();c.beginPath();path(c);c.clip();fn();c.restore();}

function glowDot(c,p,r,col,a){

function starShape(c,x,y,R,r,n,m){

}

/* ---------------- skirts, tassets, robes (drawn over the legs) ---------------- */
function drawSkirt(c,t){
  const {lk,S,K,M}=RS,sk=lk.skirt;if(!sk)return;
  const m=MAT(sk.c),m2=MAT(sk.c2);
  if(sk.type==='kusazuri'||sk.type==='pteruges'){        // plates hang from the belt and follow the thighs
    const n=sk.type==='pteruges'?5:3;
    for(let i=0;i<n;i++){
      const u=i/(n-1), L=u<.5?K.lB:K.lF, a0=lerp(K.lB.A1,K.lF.A1,u)*.8;
      const top=TPh(lerp(-9,9,u),-9), d=dirA(a0), len=sk.len*4.4*S, w=(sk.type==='pteruges'?2.4:5.2)*S;
      const n2=[-d[1],d[0]], bot=add(top,d,len);
      part(c,cc=>{cc.moveTo(top[0]+n2[0]*w,top[1]+n2[1]*w);cc.lineTo(bot[0]+n2[0]*w*1.15,bot[1]+n2[1]*w*1.15);
        cc.lineTo(bot[0]-n2[0]*w*1.15,bot[1]-n2[1]*w*1.15);cc.lineTo(top[0]-n2[0]*w,top[1]-n2[1]*w);cc.closePath();},i%2?m2:m,1.4*S);
      if(!RL&&sk.type==='kusazuri'){for(let j=1;j<4;j++){const p=add(top,d,len*j/4);inkLine(c,[add(p,n2,-w),add(p,n2,w)],.7*S,m.i);}}
    }
  } else if(sk.type==='robe'){                           // long robe: hem follows both feet
    const L=K.lB,Fr=K.lF,hemB=add(L.a,[-3*S,-2*S]),hemF=add(Fr.a,[4*S,-2*S]);
    const wl=TPh(-10.5,-10),wr=TPh(10,-10);
    const knB=add(L.k,[-6*S,0]),knF=add(Fr.k,[6*S,0]);
    part(c,cc=>{cc.moveTo(wl[0],wl[1]);cc.quadraticCurveTo(knB[0],knB[1],hemB[0]-2*S,hemB[1]);
      const n=7;for(let i=0;i<=n;i++){const q=lerpP(hemB,hemF,i/n);cc.lineTo(q[0]+(i%2?0:1)*S,q[1]+(i%2?-3:1.5)*S+Math.sin(t*4+i)*1*S);}
      cc.quadraticCurveTo(knF[0],knF[1],wr[0],wr[1]);cc.closePath();},m,5*S);
    if(!RL){inkLine(c,[TPh(2,-6),lerpP(TPh(2,-6),lerpP(hemB,hemF,.5),.9)],.9*S,m.i);}
  }
}

/* =======================================================================
   HEADS — face, eyes, hair, headgear. Head frame: origin at the skull
   centre, +x toward the face, r = head radius. Eyes switch to a detailed
   anime treatment once the head is big enough on screen (close-ups).
   ======================================================================= */
function headPath(c,r,fem){
  c.moveTo(-.93*r,.34*r);
  c.arc(0,-.02*r,r,2.78,5.95,false);
  c.quadraticCurveTo(.99*r,.02*r,.97*r,.2*r);
  c.quadraticCurveTo(1.03*r,.33*r,1.06*r,.43*r);
  c.lineTo(.97*r,.5*r);
  c.quadraticCurveTo(.99*r,.62*r,.93*r,.72*r);
  if(fem)c.quadraticCurveTo(.82*r,.97*r,.56*r,.99*r);
  else c.quadraticCurveTo(.88*r,.99*r,.6*r,1.03*r);
  c.quadraticCurveTo(.18*r,.95*r,-.18*r,.66*r);
  c.quadraticCurveTo(-.6*r,.56*r,-.93*r,.34*r);
  c.closePath();
}
const EXB={n:[0,0],f:[-.25,.6],s:[-.3,.5],h:[.1,-.4],g:[.15,.05],c:[.05,0]};
function drawEye(c,x,y,w,h,col,ex,fem,far,det,t){
  const ink='#150c1c';
  if(ex==='c'){inkLine(c,[[x-w,y],[x,y+h*.35],[x+w*.9,y+h*.05]],h*.22,ink);return;}
  if(ex==='h'){inkLine(c,[[x-w,y-h*.45],[x+w*.6,y+h*.05],[x-w*.8,y+h*.45]],h*.22,ink);return;}
  const top=ex==='f'?.62:ex==='s'?1.1:ex==='g'?.55:.95, bot=ex==='g'?.35:.72;
  if(!det){                                            // small on screen: lash bar + iris dot
    fillOnly(c,cc=>{cc.rect(x-w*.95,y-h*top*.8,w*1.9,h*(top*.8+.18));},ink);
    fillOnly(c,cc=>{cc.rect(x-w*.1+(far?0:w*.08),y-h*.2,w*.62,h*(ex==='f'?.42:.6));},mixC(col,'#ffffff',.2));
    return;
  }
  const O=[x-w,y-h*.02],A=[x-w*.1,y-h*top],I=[x+w,y+h*.08],B=[x-w*.05,y+h*bot];
  const eyeP=cc=>{cc.moveTo(O[0],O[1]);cc.quadraticCurveTo(A[0]-w*.3,A[1],A[0],A[1]);cc.quadraticCurveTo(I[0]-w*.15,A[1]+h*.1,I[0],I[1]);
    cc.quadraticCurveTo(B[0]+w*.5,B[1],B[0],B[1]);cc.quadraticCurveTo(O[0]+w*.2,B[1]-h*.1,O[0],O[1]);cc.closePath();};
  fillOnly(c,eyeP,'#f6f4ff');
  clipDo(c,eyeP,()=>{
    const ix=x+w*(far?.1:.14),iy=y+h*.06,rx=w*(ex==='s'?.38:.55),ry=h*(ex==='s'?.62:.98);
    const g=c.createLinearGradient(0,iy-ry,0,iy+ry);
    g.addColorStop(0,tc(mixC(col,'#07030f',.72)));g.addColorStop(.55,tc(col));g.addColorStop(1,tc(mixC(col,'#ffffff',.45)));
    c.fillStyle=g;c.beginPath();c.ellipse(ix,iy,rx,ry,0,0,TAU);c.fill();
    c.fillStyle=tc(mixC(col,'#07030f',.8));c.beginPath();c.ellipse(ix+w*.04,iy+h*.05,rx*.42,ry*.5,0,0,TAU);c.fill();
    c.fillStyle=tc(mixC(col,'#ffffff',.25));c.globalAlpha*=.7;c.beginPath();c.ellipse(ix,iy+ry*.55,rx*.7,ry*.28,0,0,TAU);c.fill();c.globalAlpha/=.7;
    c.fillStyle=tc('#ffffff');c.beginPath();c.ellipse(ix-rx*.35,iy-ry*.38,rx*.3,ry*.22,-.4,0,TAU);c.fill();
    c.beginPath();c.arc(ix+rx*.35,iy+ry*.3,rx*.13,0,TAU);c.fill();
    c.fillStyle=tc('rgba(40,20,60,.35)');c.beginPath();c.moveTo(O[0],O[1]-h);c.lineTo(I[0],I[1]-h);c.lineTo(I[0],I[1]-h*.62);c.lineTo(O[0],O[1]-h*.55);c.fill();
  });
  // upper lash with a wing at the outer corner
  c.beginPath();c.moveTo(O[0]-w*.12,O[1]+h*.05);c.quadraticCurveTo(A[0]-w*.3,A[1]-h*.02,A[0],A[1]-h*.02);
  c.quadraticCurveTo(I[0]-w*.15,A[1]+h*.08,I[0]+w*.05,I[1]);
  c.lineWidth=h*(fem?.3:.22);c.strokeStyle=tc(ink);c.lineCap='round';c.stroke();
  if(fem&&!far){inkLine(c,[[O[0],O[1]],[O[0]-w*.38,O[1]-h*.4]],h*.14,ink);inkLine(c,[[O[0]+w*.2,A[1]+h*.06],[O[0]-w*.12,A[1]-h*.22]],h*.11,ink);}
  inkLine(c,[[B[0]-w*.2,B[1]+h*.02],[O[0]+w*.1,O[1]+h*.18]],h*.08,ink);
}
function drawFace(c,r,ex,det,t){
  const {ch,lk}=RS,ey=lk.eyes||{c:'#3a78ff',type:'anime'},fem=lk.fem;
  const b=EXB[ex]||EXB.n, ink='#1a0f1e';
  if(ey.type==='glow'){                                  // luminous irises, still framed by lashes
    const eh=.25, ew=.23;
    drawEye(c,.36*r,.19*r,ew*r,eh*r,ch.c3,ex,fem,0,det,t);
    drawEye(c,.87*r,.18*r,ew*.42*r,eh*.95*r,ch.c3,ex,fem,1,det,t);
    if(ex!=='c'&&ex!=='h'){glowDot(c,[.4*r,.2*r],.26*r,ch.c3,.55);glowDot(c,[.88*r,.19*r],.14*r,ch.c3,.45);}
  } else if(ey.type==='anime'||ey.type==='lens'){
    const eh=fem?.25:.2, ew=fem?.23:.21;
    drawEye(c,.36*r,.19*r,ew*r,eh*r,ey.c,ex,fem,0,det,t);
    drawEye(c,.87*r,.18*r,ew*.42*r,eh*.95*r,ey.c,ex,fem,1,det,t);
  }
  {                                                     // brows
    const y0=.19*r-(fem?.3:.27)*r;
    inkLine(c,[[.14*r,y0+b[0]*.1*r],[.34*r,y0-.04*r],[.56*r,y0+b[1]*.12*r+.03*r]],(fem?.05:.075)*r,fem?mixC(ch.hairC,'#000',.35):ink);
    inkLine(c,[[.8*r,y0+b[1]*.1*r+.02*r],[.95*r,y0+.02*r]],(fem?.045:.065)*r,fem?mixC(ch.hairC,'#000',.35):ink);
  }
  if(lk.hg==='mempo')return;
  if(det)inkLine(c,[[1.02*r,.36*r],[.97*r,.45*r]],.035*r,mixC(ch.skin,'#6a2a3a',.6));
  const mx=.8*r,my=.7*r;
  if(ex==='s'||ex==='h'){
    part(c,cc=>{cc.moveTo(mx-.2*r,my-.07*r);cc.quadraticCurveTo(mx,my-.12*r,mx+.14*r,my-.08*r);
      cc.quadraticCurveTo(mx+.14*r,my+(ex==='s'?.2:.1)*r,mx-.02*r,my+(ex==='s'?.2:.1)*r);cc.quadraticCurveTo(mx-.2*r,my+.1*r,mx-.2*r,my-.07*r);cc.closePath();},MAT('#6a1a2a'),0);
    if(det)fillOnly(c,cc=>{cc.rect(mx-.17*r,my-.08*r,.3*r,.05*r);},'#ffffff');
  } else if(ex==='g'){
    part(c,cc=>{cc.moveTo(mx-.2*r,my-.06*r);cc.quadraticCurveTo(mx,my-.02*r,mx+.14*r,my-.1*r);
      cc.quadraticCurveTo(mx+.08*r,my+.1*r,mx-.08*r,my+.08*r);cc.closePath();},MAT('#ffffff'),0);
  } else {
    inkLine(c,[[mx-.16*r,my-.02*r],[mx+.1*r,my+(ex==='f'?.02:-.02)*r]],.035*r,mixC(ch.skin,'#4a1a2a',.7));
  }
}
/* anime hair shine: a jagged light band clipped to the hair shape */
function hairShine(c,path,r,m,a0,a1,rad){
  if(RL||RS.px*G.HR<7)return;
  const dark=hx(m.b).reduce((a,b)=>a+b,0)<200, col=dark?mixC(m.b,'#9fb4ff',.5):mixC(m.b,'#ffffff',.55);
  clipDo(c,path,()=>{c.beginPath();
    const n=11;for(let i=0;i<=n;i++){const a=lerp(a0,a1,i/n),q=rad*r+(i%2?.09:-.05)*r;c.lineTo(Math.cos(a)*q,Math.sin(a)*q-.05*r);}
    for(let i=n;i>=0;i--){const a=lerp(a0,a1,i/n),q=(rad-.13)*r+(i%2?.02:-.04)*r;c.lineTo(Math.cos(a)*q,Math.sin(a)*q-.05*r);}
    c.closePath();c.fillStyle=tc(col);c.globalAlpha*=.8;c.fill();c.globalAlpha/=.8;});
}
/* shared anime hair cap: domed crown, pointed bangs, a side lock framing the face.
   bangs = [[x,y],...] tip/notch points running from the front back toward the ear */
function hairCap(c,r,m,bangs,lock,back,sway){
  const cap=cc=>{cc.moveTo(-1.0*r,(back||.62)*r);cc.arc(0,-.06*r,1.1*r,2.65,-.45,false);
    for(const p of bangs)cc.lineTo(p[0]*r+(p[1]>0?sway*.05*r:0),p[1]*r);
    const L=lock||[.3,1.25];
    cc.quadraticCurveTo(.06*r,.62*r,L[0]*r-sway*.1*r,L[1]*r);cc.quadraticCurveTo(-.08*r,.95*r,-.22*r,.4*r);
    cc.quadraticCurveTo(-.6*r,.55*r,-1.0*r,(back||.62)*r);cc.closePath();};
  part(c,cap,m,.28*r);
  hairShine(c,cap,r,m,-2.45,-1.05,1.02);
  if(!RL&&RS.px*G.HR>9){const ink=mixC(m.b,'#000',.55);
    for(const p of bangs)if(p[1]>-.1)inkLine(c,[[-.1*r,-.95*r],[(p[0]*.55-.05)*r,-.35*r],[p[0]*r*.97,p[1]*r*.8]],.028*r,ink);
    inkLine(c,[[-.35*r,-.9*r],[-.75*r,-.2*r],[-.85*r,.4*r]],.028*r,ink);}
  return cap;
}
function spikePath(list,r,sway){
  return cc=>{list.forEach((p,i)=>{let a=p[0],q=p[1]*r;
    if(p[1]>1.2){a-=.12+sway*.35;}const x=Math.cos(a)*q,y=Math.sin(a)*q-.02*r;
    if(!i)cc.moveTo(x,y);else cc.lineTo(x,y);});cc.closePath();};
}
const KAGE_SPK=[[2.35,.95],[2.62,1.7],[2.78,1.02],[3.02,1.95],[-3.1,1.08],[-2.72,1.98],[-2.52,1.1],[-2.18,1.92],[-1.98,1.1],
  [-1.64,1.86],[-1.48,1.1],[-1.14,1.72],[-.98,1.05],[-.7,1.46],[-.5,.98],[.2,.5]];

/* back layer: everything behind the skull */
function drawHairBack(c,r,t,sway){
  const {ch,lk,M}=RS,st=ch.hair;
  if(st==='spiky'){const p=spikePath(KAGE_SPK,r,sway);part(c,p,M.hair,.3*r);hairShine(c,p,r,M.hair,-2.5,-1.2,1.28);}
  else if(st==='flame'){
    glowDot(c,[-.6*r,-.7*r],1.1*r,ch.c3,.45);
    for(let i=0;i<6;i++){const a=-2.95+i*.26,w=Math.sin(t*8+i*1.7)*.12*r,len=(1.0+hash(i)*.5)*r;
      const bx=Math.cos(a)*.9*r,by=Math.sin(a)*.9*r,tx=bx-len*(.85+sway*.3)+w,ty=by-len*.55-(i%2)*.2*r;
      const p=cc=>{cc.moveTo(bx-Math.sin(a)*.3*r,by+Math.cos(a)*.3*r);cc.quadraticCurveTo(bx-len*.45,by-len*.05,tx,ty);
        cc.quadraticCurveTo(bx-len*.2,by-len*.45,bx+Math.sin(a)*.3*r,by-Math.cos(a)*.3*r);cc.closePath();};
      part(c,p,M.hair,.2*r);
      if(!RL)fillOnly(c,cc=>{cc.moveTo(bx-.1*r,by);cc.quadraticCurveTo(bx-len*.4,by-len*.05,tx*.75+bx*.25,ty*.75+by*.25);cc.quadraticCurveTo(bx-len*.2,by-len*.3,bx+.1*r,by-.1*r);cc.closePath();},'#ffcf5a');}
  }
  else if(st==='astral'){
    if(!RL){c.save();c.globalCompositeOperation='lighter';
      for(let i=0;i<3;i++){const a0=-2.3+i*.38,wv=Math.sin(t*2.2+i*1.3);
        const bx=Math.cos(a0)*.85*r,by=Math.sin(a0)*.85*r;
        const P2=[[bx,by]];for(let j=1;j<=4;j++)P2.push([bx-j*.34*r-sway*j*.2*r+Math.sin(t*2.6+i+j)*.1*r*j,by-j*.2*r+wv*.1*r*j]);
        c.globalAlpha=.35;c.beginPath();tubePath(c,P2,[.16*r,.14*r,.1*r,.06*r,.01*r]);c.fillStyle=tc(ch.hairC);c.fill();}
      c.restore();}
  }
  if(lk.hg==='halo'&&!RL){c.save();c.globalCompositeOperation='lighter';c.globalAlpha=.8;
    c.strokeStyle=tc(ch.c3);c.lineWidth=.12*r;c.beginPath();c.ellipse(-.45*r,-.35*r,1.25*r,.42*r,-1.05,0,TAU);c.stroke();
    c.strokeStyle=tc('#ffffff');c.lineWidth=.04*r;c.stroke();c.restore();}
}
/* front layer: cap, bangs, headgear, ears */
function drawHairFront(c,r,t,sway){
  const {ch,lk,M}=RS,st=ch.hair,S=RS.S;
  if(st==='spiky'){
    const p=cc=>{cc.moveTo(-.2*r,-.95*r);cc.lineTo(.68*r,.02*r);cc.lineTo(.6*r,-.45*r);cc.lineTo(.92*r,.02*r);cc.lineTo(.86*r,-.4*r);
      cc.lineTo(1.12*r,-.1*r);cc.quadraticCurveTo(1.05*r,-.7*r,.4*r,-1.02*r);cc.closePath();};
    part(c,p,M.hair,.2*r);
    part(c,cc=>{cc.moveTo(-.25*r,-.4*r);cc.lineTo(.12*r,.62*r);cc.lineTo(.1*r,-.1*r);cc.closePath();},M.hair,.1*r);
  } else if(st==='long'){
    hairCap(c,r,M.hair,[[1.06,-.02],[.94,-.24],[.7,.17],[.6,-.2],[.46,-.02],[.34,-.24],[.17,-.04]],[.3,1.3],.62,sway);
    if(lk.hairPin&&!RL){part(c,cc=>{cc.ellipse(-.4*r,-.8*r,.2*r,.1*r,-.5,0,TAU);},MAT(lk.hairPin,'glow'),0);
      part(c,cc=>{cc.ellipse(-.22*r,-.93*r,.13*r,.07*r,-.9,0,TAU);},MAT('#ffffff'),0);}
  } else if(st==='longg'){                             // parted, wavy, swept to both sides
    hairCap(c,r,M.hair,[[1.0,-.35],[.78,-.5],[.62,-.1],[.4,-.42],[.22,.0]],[.34,1.35],.7,sway);
  } else if(st==='braid'){
    hairCap(c,r,M.hair,[[1.02,-.1],[.86,-.3],[.64,.05],[.5,-.3],[.3,-.1],[.2,-.3],[.1,.02]],[.22,.95],.5,sway);
  } else if(st==='topknot'){
    const cap=cc=>{cc.moveTo(-.95*r,.45*r);cc.arc(0,-.02*r,1.03*r,2.76,-.62,false);cc.quadraticCurveTo(.4*r,-.55*r,.1*r,-.2*r);
      cc.quadraticCurveTo(-.05*r,.25*r,-.2*r,.3*r);cc.quadraticCurveTo(-.55*r,.25*r,-.95*r,.45*r);cc.closePath();};
    part(c,cap,M.hair,.25*r);
    part(c,cc=>{cc.moveTo(-.2*r,-1.0*r);cc.quadraticCurveTo(-.7*r,-1.55*r,-1.25*r,-1.2*r-sway*.3*r);cc.quadraticCurveTo(-.8*r,-1.1*r,-.55*r,-.85*r);cc.closePath();},M.hair,.1*r);
    part(c,cc=>{cc.ellipse(-.32*r,-1.05*r,.24*r,.2*r,-.4,0,TAU);},M.hair,.08*r);
    hairShine(c,cap,r,M.hair,-2.2,-1.0,.95);
  } else if(st==='flame'){
    const cap=cc=>{cc.moveTo(-1.0*r,.4*r);cc.arc(0,-.05*r,1.05*r,2.75,-.35,false);
      cc.quadraticCurveTo(.95*r,.2*r,.7*r,.35*r);cc.quadraticCurveTo(.6*r,-.1*r,.25*r,-.25*r);cc.quadraticCurveTo(0,.4*r,-.18*r,.5*r);cc.closePath();};
    part(c,cap,M.hair,.26*r);hairShine(c,cap,r,MAT('#ffc24a'),-2.4,-1.1,1.0);
  } else if(st==='astral'){
    hairCap(c,r,M.hair,[[1.05,-.05],[.9,-.26],[.74,.12],[.58,-.25],[.4,-.05],[.26,-.25],[.14,.0]],[.32,1.3],.6,sway);
    if(!RL)glowDot(c,[-.2*r,-.6*r],.9*r,ch.c3,.25);
  }
  if(lk.ear==='elf')part(c,cc=>{cc.moveTo(-.02*r,.08*r);cc.quadraticCurveTo(-.5*r,-.18*r,-.92*r,-.78*r-sway*.2*r);cc.quadraticCurveTo(-.5*r,.2*r,-.2*r,.46*r);cc.closePath();},RS.M.skin,.12*r);
  drawHeadgear(c,r,t,sway);
}
function drawHeadgear(c,r,t,sway){
  const {ch,lk,M}=RS,hg=lk.hg;if(!hg)return;
  const m=M.hg;
  if(hg==='band'){
    part(c,cc=>{cc.moveTo(-1.02*r,-.55*r);cc.quadraticCurveTo(0,-.72*r,.99*r,-.48*r);cc.lineTo(1.0*r,-.2*r);cc.quadraticCurveTo(0,-.42*r,-1.04*r,-.26*r);cc.closePath();},m,.1*r);
    part(c,cc=>{cc.moveTo(.28*r,-.6*r);cc.quadraticCurveTo(.7*r,-.62*r,.98*r,-.5*r);cc.lineTo(.99*r,-.2*r);cc.quadraticCurveTo(.7*r,-.3*r,.3*r,-.3*r);cc.closePath();},MAT(lk.plate,'metal'),.08*r);
    if(!RL&&RS.px*G.HR>9){inkLine(c,[[.45*r,-.5*r],[.85*r,-.45*r]],.03*r,'#5a6478');inkLine(c,[[.45*r,-.42*r],[.85*r,-.36*r]],.03*r,'#5a6478');}
    for(let i=0;i<2;i++)part(c,cc=>{const a=[-1.0*r,-.42*r],b=[-1.55*r-i*.2*r-sway*.4*r,-.1*r+i*.35*r+Math.sin(t*6+i)*.08*r];
      cc.moveTo(a[0],a[1]-.1*r);cc.quadraticCurveTo(-1.25*r,-.42*r+i*.1*r,b[0],b[1]);cc.quadraticCurveTo(-1.25*r,-.2*r+i*.2*r,a[0],a[1]+.12*r);cc.closePath();},m,.05*r);
  } else if(hg==='cowl'){                              // vigilante cowl: pointed ears, white lenses, jaw exposed
    const cw=cc=>{cc.moveTo(1.08*r,.44*r);cc.quadraticCurveTo(.72*r,.5*r,.46*r,.5*r);cc.quadraticCurveTo(.26*r,.62*r,.14*r,.92*r);cc.lineTo(-.38*r,.98*r);
      cc.quadraticCurveTo(-1.04*r,.62*r,-1.05*r,.0);cc.arc(0,-.02*r,1.06*r,Math.PI,-.3,false);cc.quadraticCurveTo(1.02*r,.0,1.05*r,.18*r);cc.closePath();};
    for(const k of[0,1]){const x0=k?.18:-.3;
      part(c,cc=>{cc.moveTo((x0-.24)*r,-.84*r);cc.lineTo((x0-.08)*r-sway*.1*r,(-1.62+k*.06)*r);cc.lineTo((x0+.16)*r,-.9*r);cc.closePath();},k?m:farM(m),.08*r);}
    part(c,cw,m,.25*r);
    if(!RL){inkLine(c,[[.25*r,-.72*r],[.95*r,-.12*r]],.03*r,m.l);
      inkLine(c,[[.46*r,.5*r],[.9*r,.34*r]],.03*r,m.i);}
    for(const[x0,x1,y0,s2]of[[.14,.6,.08,1],[.8,1.02,.06,.75]]){
      glowDot(c,[(x0+x1)/2*r,y0*r+.08*r],.36*r*s2,ch.c3,.55);
      fillOnly(c,cc=>{cc.moveTo(x0*r,y0*r+.02*r);cc.lineTo(x1*r,y0*r-.06*r);cc.lineTo((x1-.05)*r,y0*r+.15*r);cc.lineTo((x0+.06)*r,y0*r+.19*r);cc.closePath();},'#f4f6ff');}
  } else if(hg==='helm'){
    const hp=cc=>{cc.moveTo(-.95*r,.6*r);cc.arc(0,-.05*r,1.1*r,2.6,-.28,false);cc.lineTo(1.12*r,-.18*r);cc.lineTo(.42*r,-.24*r);
      cc.quadraticCurveTo(.3*r,.1*r,.44*r,.58*r);cc.quadraticCurveTo(.3*r,.86*r,.05*r,.86*r);cc.quadraticCurveTo(-.5*r,.8*r,-.95*r,.6*r);cc.closePath();};
    part(c,hp,m,.3*r);
    part(c,cc=>{cc.moveTo(.9*r,-.72*r);cc.quadraticCurveTo(-.2*r,-1.5*r,-1.05*r,-.62*r);cc.lineTo(-.9*r,-.45*r);cc.quadraticCurveTo(-.1*r,-1.2*r,.95*r,-.55*r);cc.closePath();},MAT(ch.c3),.05*r);
    part(c,cc=>{cc.ellipse(-.12*r,.18*r,.2*r,.22*r,0,0,TAU);},M.metal,.05*r);
    if(!RL)inkLine(c,[[.42*r,-.24*r],[1.1*r,-.18*r]],.06*r,M.metal.l);
  } else if(hg==='mech'){
    const hp=cc=>{cc.moveTo(-.95*r,.45*r);cc.lineTo(-.9*r,-.62*r);cc.quadraticCurveTo(-.6*r,-1.05*r,.45*r,-.98*r);cc.quadraticCurveTo(1.0*r,-.9*r,1.05*r,-.4*r);
      cc.lineTo(1.08*r,.45*r);cc.lineTo(.86*r,.98*r);cc.lineTo(.08*r,1.02*r);cc.lineTo(-.5*r,.82*r);cc.closePath();};
    part(c,cc=>{cc.moveTo(-.55*r,-.8*r);cc.lineTo(-1.5*r-sway*.2*r,-1.35*r);cc.lineTo(-1.0*r,-.5*r);cc.closePath();},MAT(ch.c1,'metal'),.1*r);
    part(c,hp,m,.32*r);
    part(c,cc=>{cc.moveTo(.05*r,-.22*r);cc.lineTo(1.1*r,-.18*r);cc.lineTo(1.1*r,.3*r);cc.lineTo(.12*r,.26*r);cc.closePath();},MAT('#141a26'),0);
    const blink=Math.sin(t*1.3)>.97?.2:1;
    glowDot(c,[.62*r,.04*r],.7*r,ch.c3,.9*blink);
    fillOnly(c,cc=>{cc.rect(.2*r,-.02*r,.88*r,.1*r);},mixC(ch.c3,'#ffffff',.5*blink));
    if(!RL){for(let i=0;i<3;i++)inkLine(c,[[.35*r+i*.18*r,.55*r],[.35*r+i*.18*r,.85*r]],.05*r,m.i);
      part(c,cc=>{cc.arc(-.25*r,.15*r,.28*r,0,TAU);},M.metal,.06*r);glowDot(c,[-.25*r,.15*r],.3*r,ch.c3,.6);}
  } else if(hg==='hood'){
    const hp=cc=>{cc.moveTo(-1.1*r,1.35*r);cc.quadraticCurveTo(-1.6*r,.2*r,-1.15*r-sway*.3*r,-1.45*r);cc.quadraticCurveTo(.3*r,-1.55*r,1.2*r,-.6*r);
      cc.quadraticCurveTo(1.35*r,.3*r,1.1*r,1.0*r);cc.lineTo(.7*r,1.45*r);cc.closePath();};
    part(c,hp,m,.35*r);
    const vd=cc=>{cc.ellipse(.62*r,.25*r,.55*r,.82*r,.08,0,TAU);};
    if(!RL){c.save();c.beginPath();vd(c);c.fillStyle=tc('#050308');c.fill();c.restore();
      for(const[x,s]of[[.52,1],[.9,.7]]){glowDot(c,[x*r,.12*r],.4*r*s,ch.c3,1);
        fillOnly(c,cc=>{cc.ellipse(x*r,.12*r,.12*r*s,.07*r,0,0,TAU);},'#eaffdf');}
      inkLine(c,[[1.18*r,-.55*r],[1.3*r,.3*r],[1.05*r,1.0*r]],.07*r,rgba(ch.c3,.5));}
    else fillOnly(c,vd,'#050308');
  } else if(hg==='circlet'){
    part(c,cc=>{cc.moveTo(-.98*r,-.42*r);cc.quadraticCurveTo(0,-.72*r,.98*r,-.38*r);cc.lineTo(.98*r,-.26*r);cc.quadraticCurveTo(0,-.58*r,-.98*r,-.3*r);cc.closePath();},m,.05*r);
    for(const s of[0,1])part(c,cc=>{const x=s?-.1*r:-.45*r;cc.moveTo(x,-.66*r);cc.lineTo(x-.55*r,-1.2*r);cc.lineTo(x-.15*r,-.62*r);cc.closePath();},m,.05*r);
    glowDot(c,[.9*r,-.36*r],.25*r,ch.c3,.9);
    part(c,cc=>{cc.ellipse(.9*r,-.36*r,.1*r,.12*r,0,0,TAU);},MAT(ch.c3,'glow'),0);
  } else if(hg==='mempo'){
    part(c,cc=>{cc.moveTo(-1.02*r,-.5*r);cc.quadraticCurveTo(0,-.66*r,.99*r,-.42*r);cc.lineTo(1.0*r,-.24*r);cc.quadraticCurveTo(0,-.46*r,-1.04*r,-.3*r);cc.closePath();},MAT('#e9e2cf'),.06*r);
    part(c,cc=>{cc.moveTo(.26*r,.36*r);cc.lineTo(1.06*r,.32*r);cc.lineTo(1.15*r,.47*r);cc.lineTo(1.05*r,.62*r);cc.quadraticCurveTo(1.0*r,.98*r,.8*r,1.04*r);
      cc.lineTo(.42*r,1.02*r);cc.quadraticCurveTo(.2*r,.8*r,.26*r,.36*r);cc.closePath();},m,.12*r);
    if(!RL){inkLine(c,[[.62*r,.72*r],[.95*r,.72*r]],.035*r,m.i);inkLine(c,[[.66*r,.84*r],[.9*r,.84*r]],.035*r,m.i);
      inkLine(c,[[.26*r,.5*r],[-.85*r,.3*r]],.04*r,'#2a2a32');}
  }
}
function drawHead(c,t,opt){
  const {ch,lk,M,K,S,po}=RS,g=K.g;
  const r=G.HR*S*(lk.toon?1.4:1)*Math.min(1.05,Math.max(.97,g));
  const ha=K.ha, hd=K.head;
  const covered=lk.hg==='mech'||lk.hg==='cowl';
  const neckM=lk.hg==='mech'?MAT('#3a4458','metal'):lk.hg==='cowl'?M.hg:M.skin;
  const nb=add(K.neck,K.up,-4*S), nt=add(hd,dirA(ha),.55*r);
  if(!lk.toon)part(c,cc=>segPath(cc,nb,nt,3.7*S*g,3.5*S*g,3.4*S*g),neckM,1.4*S);
  if(lk.scarf&&!lk.scarf.head){                            // scarf wrapped at the throat
    const a=add(K.neck,K.up,-2*S);
    part(c,cc=>{cc.ellipse(a[0]+1*S,a[1]-1*S,7.4*S*g,4.6*S,K.lt+.1,0,TAU);},MAT(lk.scarf.c),1.6*S);
    if(!RL)inkLine(c,[[a[0]-5*S,a[1]],[a[0]+6*S,a[1]-2*S]],.8*S,mixC(lk.scarf.c,'#000',.6));
  }
  c.save();c.translate(hd[0],hd[1]);c.rotate(ha);
  const sway=RS.opt.sway||0, det=RS.px*G.HR>13;
  drawHairBack(c,r,t,sway);
  if(lk.toon){drawToonHead(c,r,t,po.ex);c.restore();return;}
  if(lk.hg!=='mech'&&lk.hg!=='hood'){
    const hp=cc=>headPath(cc,r,lk.fem);
    part(c,hp,M.skin,.24*r);
    if(!RL&&det&&!covered)fillOnly(c,cc=>{cc.ellipse(.62*r,.52*r,.16*r,.08*r,0,0,TAU);},rgba('#ff7a8a',.18));
    if(!RL&&ch.id==='kage')for(let i=0;i<3;i++)inkLine(c,[[.46*r,(.4+i*.1)*r],[.74*r,(.43+i*.09)*r]],.03*r,'#7a4a3a');
    if(lk.hg!=='helm'&&lk.hg!=='cowl'&&lk.ear!=='elf'&&!/long|astral|flame/.test(ch.hair)&&!RL)part(c,cc=>{cc.ellipse(-.14*r,.24*r,.15*r,.24*r,-.1,0,TAU);},M.skin,.06*r);
    if(!RL)drawFace(c,r,po.ex||'n',det,t);
  }
  drawHairFront(c,r,t,sway);
  c.restore();
}
function drawToonHead(c,r,t,ex){
  const {ch}=RS,m=MAT(ch.skin),ink='#241d12';
  part(c,cc=>{cc.ellipse(.1*r,0,1.05*r,.98*r,0,0,TAU);},m,0);
  part(c,cc=>{cc.ellipse(-.3*r,.12*r,.17*r,.22*r,0,0,TAU);},m,0);         // ear
  if(!RL)inkLine(c,[[-.24*r,.02*r],[-.36*r,.12*r],[-.25*r,.22*r]],.05*r,'#241d12');
  part(c,cc=>{cc.moveTo(-.3*r,-.8*r);cc.quadraticCurveTo(-.2*r,-1.7*r,.5*r,-1.55*r);cc.quadraticCurveTo(.1*r,-1.35*r,.3*r,-.95*r);
    cc.quadraticCurveTo(.6*r,-1.5*r,1.05*r,-1.2*r);cc.quadraticCurveTo(.7*r,-1.05*r,.6*r,-.8*r);cc.closePath();},MAT(ch.hairC),0);
  if(RL)return;
  const bl=Math.sin(t*1.7)>.985;
  for(const[x,s]of[[.42,1],[.85,.8]]){
    if(ex==='h'||bl){inkLine(c,[[x*r-.12*r*s,-.12*r],[x*r+.12*r*s,-.1*r]],.08*r,ink);continue;}
    part(c,cc=>{cc.ellipse(x*r,-.18*r,.17*r*s,.3*r,0,0,TAU);},MAT('#ffffff'),0);
    fillOnly(c,cc=>{const px=x*r+.04*r*s,py=-.1*r;cc.moveTo(px,py);cc.ellipse(px,py,.09*r*s,.17*r,0,.6,TAU-.1);cc.closePath();},ink);
  }
  if(ex==='s'||ex==='h'){part(c,cc=>{cc.ellipse(.75*r,.45*r,.28*r,.24*r,0,0,TAU);},MAT('#6a1a2a'),0);
    fillOnly(c,cc=>{cc.ellipse(.75*r,.56*r,.16*r,.09*r,0,0,TAU);},'#ff6a8a');}
  else{part(c,cc=>{cc.moveTo(.3*r,.28*r);cc.quadraticCurveTo(.75*r,.82*r,1.12*r,.2*r);cc.quadraticCurveTo(.75*r,.46*r,.3*r,.28*r);cc.closePath();},MAT('#6a1a2a'),0);
    fillOnly(c,cc=>{cc.moveTo(.42*r,.33*r);cc.quadraticCurveTo(.75*r,.5*r,1.02*r,.28*r);cc.lineTo(.98*r,.38*r);cc.quadraticCurveTo(.75*r,.56*r,.46*r,.4*r);cc.closePath();},'#ffffff');}
  part(c,cc=>{cc.ellipse(1.08*r,.12*r,.16*r,.13*r,0,0,TAU);},MAT('#241d12'),0);    // button nose
}

/* ---------------- weapons (drawn in the hand frame: +x runs along the weapon) ---------------- */
const WEP_LEN={katana:90,blade:90,cleaver:98,staff:74,hammer:78,scythe:72,bow:20,shield:30,claw:30,cannon:28,none:9};
function drawWeapon(c,t,opt){
  const {ch,K,po,S,M}=RS,w=ch.wep;if(w==='none'||opt.noWep)return;
  if(w==='katana'&&opt.sheathed)return;
  const A=K.aF;
  if(w==='shield'){                                     // strapped to the forearm, stays mostly upright
    const p=lerpP(A.e,A.h,.58),rr=clamp((Math.PI/2-A.A2)*.22,-.5,.5)+(po.wa||0)*.3;
    c.save();c.translate(p[0]+3*S,p[1]);c.rotate(rr);
    const sp=cc=>{cc.moveTo(-17*S,-22*S);cc.quadraticCurveTo(0,-26*S,17*S,-22*S);cc.quadraticCurveTo(19*S,6*S,0,27*S);cc.quadraticCurveTo(-19*S,6*S,-17*S,-22*S);cc.closePath();};
    partD(c,sp,MAT(ch.c1),3*S,-3*S);
    if(!RL){
      clipDo(c,sp,()=>{part(c,cc=>{cc.moveTo(-20*S,-9*S);cc.lineTo(0,4*S);cc.lineTo(20*S,-9*S);cc.lineTo(20*S,-1*S);cc.lineTo(0,12*S);cc.lineTo(-20*S,-1*S);cc.closePath();},MAT('#f2f5ff'),1*S);});
      c.lineWidth=2.4*S;c.strokeStyle=tc('#c9d4e8');c.beginPath();sp(c);c.stroke();
      c.lineWidth=OLW;c.strokeStyle=tc(MAT(ch.c1).i);c.stroke();
      part(c,cc=>{cc.arc(0,-14*S,4.4*S,0,TAU);},MAT(ch.c2),.8*S);

/* ---------------- cloth: verlet chains simulated in the fighter's own space ----------------
   Body motion comes in as air drag, so capes trail behind a dash and lift on a fall. */
function chain(st,key,anchor,n,seg,env,t){
  const S=RS.S;
  if(!st){                                             // no state (menus, portraits): procedural drape
    const out=[];for(let i=0;i<n;i++)out.push([anchor[0]-i*seg*(env.back||.35)+Math.sin(t*1.9+i*.55)*i*seg*.07,anchor[1]+i*seg*.9-(env.lift||0)*i*seg]);
    return out;
  }
  let C=st[key];
  if(!C||C.p.length!==n||Math.abs(C.p[0][0]-anchor[0])>60*S){
    C=st[key]={p:[]};for(let i=0;i<n;i++){const x=anchor[0]-i*seg*.35,y=anchor[1]+i*seg*.9;C.p.push([x,y,x,y]);}
  }
  const P=C.p,dt=Math.min(RS.dtc||0,1/30);
  if(dt>0){
    const g=(env.g||1000)*S,dr=env.drag||2.4,vx=RS.opt.vx||0,vy=RS.opt.vy||0,dm=env.damp||.96;
    for(let i=1;i<n;i++){const q=P[i],px=(q[0]-q[2])/dt,py=(q[1]-q[3])/dt;
      const ax=-(vx+px)*dr-(env.bias||60)*S+Math.sin(t*(env.fq||5)+i*.9+key.length)*(env.wind||120)*S*i/n;
      const ay=g-(vy+py)*dr*.6;
      const nx=q[0]+(q[0]-q[2])*dm+ax*dt*dt,ny=q[1]+(q[1]-q[3])*dm+ay*dt*dt;
      q[2]=q[0];q[3]=q[1];q[0]=nx;q[1]=ny;}
  }
  P[0][0]=P[0][2]=anchor[0];P[0][1]=P[0][3]=anchor[1];
  for(let it=0;it<4;it++){
    for(let i=1;i<n;i++){const a=P[i-1],b=P[i],dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1e-4,df=(d-seg)/d;
      if(i===1){b[0]-=dx*df;b[1]-=dy*df;}else{a[0]+=dx*df*.5;a[1]+=dy*df*.5;b[0]-=dx*df*.5;b[1]-=dy*df*.5;}}
    if(env.maxX!==undefined)for(let i=1;i<n;i++){const lim=env.maxX+i*(env.slope||0);if(P[i][0]>lim)P[i][0]=lim;}
    for(let i=1;i<n;i++)if(P[i][1]>-.5*S)P[i][1]=-.5*S;
  }
  return P.map(q=>[q[0],q[1]]);
}
function headPt(x,y){const {K,S}=RS,r=G.HR*S;const p=rot(x*r,y*r,K.ha);return[K.head[0]+p[0],K.head[1]+p[1]];}
function drawBackCloth(c,t,st){
  const {lk,S,ch,M}=RS;

    part(c,cc=>segPath(cc,add(a,[-4*S,-6*S]),b,3.6*S,4*S,3.4*S,.5),MAT('#6b4a2a'),1*S);
    for(let i=0;i<3;i++){const p=add(a,[-5*S+i*2.4*S,-9*S-i*1.4*S]);part(c,cc=>{cc.moveTo(p[0],p[1]);cc.lineTo(p[0]-2*S,p[1]-5*S);cc.lineTo(p[0]+2*S,p[1]-4*S);cc.closePath();},MAT(ch.c3),0);}}
  if(lk.cape){const cp=lk.cape,an=TP(-5,-37.5),n=6,seg=cp.len*1.45*S;
    const P=chain(st,'cape',an,n,seg,{g:1100,drag:2.2,bias:90,wind:150,maxX:an[0]+3*S,slope:-.6*S,back:.42},t);
    const Wd=P.map((_,i)=>lerp(4.5,cp.w*.55,i/(n-1))*S);
    const cm=MAT(cp.c),cm2=MAT(cp.c2);
    part(c,cc=>{tubePath(cc,P,Wd);},cm,3*S);

      clipDo(c,cc=>tubePath(cc,P,Wd),()=>{
        const P2=P.map((p,i)=>[p[0]+Wd[i]*.45,p[1]]);fillOnly(c,cc=>tubePath(cc,P2,Wd.map(w=>w*.5)),cm2.b);
        if(cp.style==='galaxy'){for(let i=0;i<22;i++){const q=P[1+(i%(n-1))],w=Wd[1+(i%(n-1))];
            const x=q[0]+(hash(i*1.7)-.5)*w*2,y=q[1]+(hash(i*2.9)-.5)*seg,tw=.4+.6*Math.abs(Math.sin(t*2+i));
            fillOnly(c,cc=>{cc.arc(x,y,(.5+hash(i)*.9)*S*tw,0,TAU);},'#ffffff');}

      });

        part(c,cc=>{for(let i=0;i<=6;i++){const u=i/6*2-1,x=e[0]+nx*w*u,y=e[1]+ny*w*u;cc.lineTo(x+d/L*(i%2?9:1)*S,y+dy/L*(i%2?9:1)*S);}

    const Wd=P.map((_,i)=>lerp(hl.w*.55,1.2,Math.pow(i/(hl.n-1),1.3))*S*(hl.wave?1+.18*Math.sin(i*2.2+t*3):1));
    const hp=cc=>tubePath(cc,P,Wd,1);
    if(hl.cosmic&&!RL){                                  // starlit hair: cyan roots fading to violet

      const e=P[P.length-1],gr=c.createLinearGradient(an[0],an[1],e[0],e[1]);
      gr.addColorStop(0,tc(ch.hairC));gr.addColorStop(.55,tc('#8a6aff'));gr.addColorStop(1,tc('#3a1a8a'));
      c.fillStyle=gr;c.fill();
      clipDo(c,hp,()=>{for(let i=0;i<14;i++){const q=P[1+(i%(P.length-1))],w=Wd[1+(i%(P.length-1))];
        const x=q[0]+(hash(i*3.1)-.5)*w*1.6,y=q[1]+(hash(i*1.3)-.5)*hl.len*S,tw=.4+.6*Math.abs(Math.sin(t*2.4+i));
        fillOnly(c,cc=>{cc.arc(x,y,(.5+hash(i)*.8)*S*tw,0,TAU);},'#ffffff');}});
      glowDot(c,P[2],14*S,ch.c3,.3);
    } else {
      part(c,hp,M.hair,2.6*S);
      if(!RL&&RS.px>1.2){inkLine(c,P.slice(1).map((p,i)=>[p[0]+Wd[i+1]*.2,p[1]]),.6*S,M.hair.i);}
    }
    if(hl.flame&&!RL){                                   // the ends of the hair burn
      for(let i=2;i<P.length;i++){const q=P[i],fl=Math.sin(t*9+i*2)*2*S,L2=(5+i*1.6)*S;
        glowDot(c,q,L2*.9,ch.c3,.4);

          cc.quadraticCurveTo(q[0]-L2*.2,q[1]-L2*.6,q[0]+3*S,q[1]);cc.closePath();},MAT(i%2?'#ff8a2a':'#ffb13d','glow'),0);}
    }}
  const br=lk.braid;
  if(br){const an=headPt(-.78,.15),P=chain(st,'braid',an,br.n,br.len*S*1.2,{g:1300,drag:3,bias:50,wind:50,back:.28},t);
    for(let i=P.length-1;i>=0;i--){const q=P[i],w=lerp(4.2,2.8,i/P.length)*S;
      part(c,cc=>{cc.ellipse(q[0],q[1],w,w*1.25,0,0,TAU);},M.hair,1*S);}
    const e=P[P.length-1];part(c,cc=>{cc.ellipse(e[0],e[1]+3*S,2*S,3.2*S,0,0,TAU);},MAT(ch.c3),0);}
  const sc=lk.scarf;
  if(sc){const an=sc.head?headPt(-1.02,-.38):TP(-5,-40.5),n=sc.len+1;
    const P=chain(st,'scarf',an,n,(sc.head?4.8:6.2)*S,{g:sc.head?600:520,drag:2.2,bias:sc.head?120:240,wind:sc.head?260:420,fq:9,back:.7,lift:.12},t);

      part(c,cc=>{tubePath(cc,[P[2]].concat(P2),[Wd[2]].concat(P2.map(()=>sc.w*.6*S)));},MAT(mixC(sc.c,'#000',.18)),1*S);}}

  if(sk&&(sk.type==='coat'||sk.type==='split')){const an=TPh(-8.5,-8),n=5,seg=sk.len*1.5*S;
    const P=chain(st,'tail',an,n,seg,{g:1100,drag:2.6,bias:60,wind:70,back:.3},t);
    const Wd=P.map((_,i)=>lerp(7,sk.type==='split'?11:9.5,i/(n-1))*S);
    part(c,cc=>tubePath(cc,P,Wd),MAT(sk.c),3*S);
    if(!RL){const P2=P.map((p,i)=>[p[0]+Wd[i]*.55,p[1]]);clipDo(c,cc=>tubePath(cc,P,Wd),()=>fillOnly(c,cc=>tubePath(cc,P2,Wd.map(w=>w*.35)),MAT(sk.c2).b));}}
}
